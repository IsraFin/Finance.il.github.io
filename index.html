{id:'investing', icon:'📈', color:'#C98A1F', name:{en:'Investing', he:'השקעות', ar:'الاستثمار'},
 subs:[
  {name:{en:'The Basics', he:'היסודות', ar:'الأساسيات'}, topics:[
   {id:'invest-what-is', en:{t:`What Is Investing?`,b:`Investing means using your money to buy something you expect to grow in value or pay you income over time — like a share of a company. Unlike a savings account, there's no guarantee, but there's more room for your money to grow.`}, he:{t:`מהי השקעה?`,b:`השקעה משמעה שימוש בכסף שלכם לקניית משהו שאתם מצפים שיעלה בערכו או ישלם לכם הכנסה עם הזמן — כמו מניה בחברה. בניגוד לחשבון חיסכון, אין הבטחה, אבל יש יותר מקום לכסף שלכם לגדול.`}, ar:{t:`ما هو الاستثمار؟`,b:`الاستثمار يعني استخدام مالك لشراء شيء تتوقع أن تزداد قيمته أو يدفع لك دخلاً مع الوقت — مثل سهم في شركة. على عكس حساب التوفير، لا يوجد ضمان، لكن هناك مجال أكبر لنمو مالك.`}},
   {id:'risk-return', en:{t:`Risk and Return`,b:`As a general rule, investments that offer higher potential returns also carry higher risk of loss. Understanding this trade-off — instead of chasing returns without weighing the risk — is one of the most important investing skills.`}, he:{t:`סיכון ותשואה`,b:`ככלל אצבע, השקעות שמציעות תשואה פוטנציאלית גבוהה יותר נושאות גם סיכון גבוה יותר להפסד. הבנת הפשרה הזו — במקום לרדוף אחרי תשואות בלי לשקול את הסיכון — היא אחת המיומנויות החשובות ביותר בהשקעות.`}, ar:{t:`المخاطرة والعائد`,b:`كقاعدة عامة، الاستثمارات التي تقدّم عوائد محتملة أعلى تحمل أيضاً مخاطرة أعلى للخسارة. فهم هذه المفاضلة — بدلاً من ملاحقة العوائد دون تقييم المخاطرة — من أهم مهارات الاستثمار.`}},
   {id:'diversification', en:{t:`Diversification`,b:`Diversification means spreading your money across different investments instead of putting it all in one place. If one investment loses value, the others can help balance it out — it's the closest thing investing has to a free safety net.`}, he:{t:`פיזור סיכונים`,b:`פיזור השקעות משמעו לפזר את הכסף שלכם על פני השקעות שונות במקום לשים הכל במקום אחד. אם השקעה אחת מאבדת מערכה, האחרות יכולות לאזן את זה — זה הדבר הכי קרוב לרשת ביטחון "בחינם" בעולם ההשקעות.`}, ar:{t:`التنويع`,b:`التنويع يعني توزيع مالك على استثمارات مختلفة بدلاً من وضعه كله في مكان واحد. إذا فقد استثمار واحد قيمته، يمكن للاستثمارات الأخرى أن توازن ذلك — إنه أقرب شيء لشبكة أمان "مجانية" في عالم الاستثمار.`}},
   {id:'compound-growth', en:{t:`Compound Growth`,b:`When investment returns are reinvested instead of withdrawn, they start generating their own returns — growth builds on growth. Starting even small amounts early in life can outperform larger amounts invested later, simply because of time.`}, he:{t:`צמיחה מצטברת`,b:`כשתשואות מהשקעה מושקעות מחדש במקום להימשך, הן מתחילות ליצור תשואות משלהן — צמיחה שנבנית על גבי צמיחה. התחלה עם סכומים קטנים בגיל צעיר יכולה להשיג יותר מסכומים גדולים שהושקעו מאוחר יותר, פשוט בזכות הזמן.`}, ar:{t:`النمو المركب`,b:`عندما يُعاد استثمار عوائد الاستثمار بدلاً من سحبها، تبدأ هذه العوائد بتوليد عوائدها الخاصة — نمو يُبنى على نمو. البدء حتى بمبالغ صغيرة في سن مبكرة يمكن أن يتفوق على مبالغ أكبر استُثمرت لاحقاً، لمجرد عامل الوقت.`}}
  ]},
  {name:{en:'Investment Types', he:'סוגי השקעות', ar:'أنواع الاستثمارات'}, topics:[
   {id:'stocks', en:{t:`Stocks`,b:`A stock (or share) is a small piece of ownership in a company. When the company does well, the stock's price can rise; when it struggles, the price can fall. Owning stock means sharing in both the company's success and its risk.`}, he:{t:`מניות`,b:`מניה היא חלק קטן מהבעלות על חברה. כשלחברה הולך טוב, מחיר המניה יכול לעלות; כשהיא נקלעת לקשיים, המחיר יכול לרדת. החזקת מניה משמעה לשתף גם בהצלחת החברה וגם בסיכון שלה.`}, ar:{t:`الأسهم`,b:`السهم هو جزء صغير من ملكية شركة ما. عندما تحقق الشركة أداءً جيداً، يمكن أن يرتفع سعر السهم؛ وعندما تواجه صعوبات، يمكن أن ينخفض السعر. امتلاك سهم يعني المشاركة في نجاح الشركة وفي مخاطرها معاً.`}},
   {id:'bonds', en:{t:`Bonds`,b:`A bond is essentially a loan you give to a government or company, which pays you back with interest over time. Bonds are usually considered steadier than stocks, though they typically offer lower potential growth.`}, he:{t:`אג"ח`,b:`אג"ח (איגרת חוב) הוא בעצם הלוואה שאתם נותנים לממשלה או לחברה, שמחזירה לכם אותה עם ריבית עם הזמן. אג"ח נחשב בדרך כלל יציב יותר ממניות, אך בדרך כלל מציע פוטנציאל צמיחה נמוך יותר.`}, ar:{t:`السندات`,b:`السند هو في الأساس قرض تقدمه لحكومة أو شركة، تعيده لك مع فائدة مع مرور الوقت. تُعتبر السندات عادةً أكثر استقراراً من الأسهم، لكنها عادةً ما تقدّم إمكانية نمو أقل.`}},
   {id:'mutual-funds', en:{t:`Mutual Funds`,b:`A mutual fund pools money from many investors and a professional manager decides how to invest it, often across many stocks or bonds at once. It's a way to get diversification without picking every investment yourself.`}, he:{t:`קרנות נאמנות`,b:`קרן נאמנות מאגדת כסף ממשקיעים רבים, ומנהל מקצועי מחליט איך להשקיע אותו, לרוב על פני מניות או אג"ח רבים בו-זמנית. זו דרך לקבל פיזור השקעות בלי לבחור כל השקעה בעצמכם.`}, ar:{t:`صناديق الاستثمار المشتركة`,b:`يجمع صندوق الاستثمار المشترك المال من مستثمرين كثيرين، ويقرر مدير محترف كيفية استثماره، غالباً عبر أسهم أو سندات عديدة في آن واحد. إنها طريقة للحصول على التنويع دون اختيار كل استثمار بنفسك.`}},
   {id:'etfs', en:{t:`ETFs`,b:`An ETF (Exchange-Traded Fund) is similar to a mutual fund — a basket of many investments — but it trades on the stock exchange like a single stock, and usually costs less to own. ETFs are popular with beginner investors for this reason.`}, he:{t:`קרנות סל (ETF)`,b:`קרן סל (ETF) דומה לקרן נאמנות — סל של השקעות רבות — אך היא נסחרת בבורסה כמו מניה בודדת, ולרוב עולה פחות להחזיק. בזכות זה, קרנות סל פופולריות בקרב משקיעים מתחילים.`}, ar:{t:`صناديق الاستثمار المتداولة (ETF)`,b:`صندوق الاستثمار المتداول يشبه صندوق الاستثمار المشترك — سلة من استثمارات كثيرة — لكنه يُتداول في البورصة مثل سهم واحد، وعادةً ما تكون تكلفة امتلاكه أقل. لهذا السبب، تحظى صناديق ETF بشعبية بين المستثمرين المبتدئين.`}},
   {id:'index-funds', en:{t:`Index Funds`,b:`An index fund is a type of fund that simply tracks a whole market index — like all the biggest companies in the US — instead of trying to pick winners. It's low-cost, simple, and historically hard for most active investors to beat.`}, he:{t:`קרנות מחקות מדד`,b:`קרן מחקה מדד היא סוג של קרן שפשוט עוקבת אחרי מדד שוק שלם — כמו כל החברות הגדולות בארה"ב — במקום לנסות לבחור "מנצחות". היא זולה, פשוטה, ומבחינה היסטורית קשה לרוב המשקיעים האקטיביים להכות אותה.`}, ar:{t:`صناديق المؤشرات`,b:`صندوق المؤشر هو نوع من الصناديق يتتبع ببساطة مؤشراً سوقياً كاملاً — مثل جميع أكبر الشركات في الولايات المتحدة — بدلاً من محاولة اختيار "الفائزين". إنه منخفض التكلفة وبسيط، ومن الصعب تاريخياً على معظم المستثمرين النشطين التفوق عليه.`}},
   {id:'sp500', en:{t:`The S&P 500`,b:`The S&P 500 is an index tracking 500 of the largest publicly traded companies in the United States. It's one of the most-watched benchmarks in the world and a common way for international investors, including Israelis, to invest in the US market.`}, he:{t:`מדד ה-S&P 500`,b:`מדד ה-S&P 500 עוקב אחרי 500 מהחברות הציבוריות הגדולות ביותר בארצות הברית. זהו אחד המדדים הנצפים ביותר בעולם ודרך נפוצה למשקיעים בינלאומיים, כולל ישראלים, להשקיע בשוק האמריקאי.`}, ar:{t:`مؤشر S&P 500`,b:`مؤشر S&P 500 يتتبع 500 من أكبر الشركات المتداولة علناً في الولايات المتحدة. إنه أحد أكثر المؤشرات متابعة في العالم وطريقة شائعة للمستثمرين الدوليين، بمن فيهم الإسرائيليون، للاستثمار في السوق الأمريكي.`}}
  ]},
  {name:{en:'The Israeli Angle', he:'ההיבט הישראלי', ar:'الجانب الإسرائيلي'}, topics:[
   {id:'israeli-vs-foreign', en:{t:`Israeli vs. Foreign Investments`,b:`You can invest on the Tel Aviv Stock Exchange, in foreign markets like the US, or both. Israeli investments may feel more familiar and are priced in shekels; foreign markets offer access to different companies and economies, but add currency risk.`}, he:{t:`השקעות ישראליות מול זרות`,b:`אפשר להשקיע בבורסה לניירות ערך בתל אביב, בשווקים זרים כמו ארה"ב, או בשניהם. השקעות ישראליות עשויות להרגיש מוכרות יותר ומתומחרות בשקלים; שווקים זרים נותנים גישה לחברות וכלכלות אחרות, אך מוסיפים סיכון מטבע.`}, ar:{t:`الاستثمارات الإسرائيلية مقابل الأجنبية`,b:`يمكنك الاستثمار في بورصة تل أبيب، أو في أسواق أجنبية مثل الولايات المتحدة، أو في كليهما. الاستثمارات الإسرائيلية قد تبدو أكثر ألفة ومُسعّرة بالشيكل؛ الأسواق الأجنبية تتيح الوصول إلى شركات واقتصادات مختلفة، لكنها تضيف مخاطرة العملة.`}},
   {id:'investment-taxes-il', en:{t:`Taxes on Investments in Israel`,b:`Profit from selling an investment (capital gains) is generally taxed at 25% for individuals in Israel. This tax applies to the gain only — the increase in value — not the full amount you originally invested.`}, he:{t:`מיסוי השקעות בישראל`,b:`רווח ממכירת השקעה (רווח הון) ממוסה בדרך כלל ב-25% עבור יחידים בישראל. המס הזה חל רק על הרווח — עליית הערך — ולא על כל הסכום שהשקעתם במקור.`}, ar:{t:`ضريبة الاستثمارات في إسرائيل`,b:`يُفرض عادةً على الربح من بيع استثمار (أرباح رأسمالية) ضريبة بنسبة 25% للأفراد في إسرائيل. تُطبَّق هذه الضريبة فقط على الربح — الزيادة في القيمة — وليس على كامل المبلغ الذي استثمرته أصلاً.`}},
   {id:'investment-fees', en:{t:`Investment Fees`,b:`Every investment account or fund charges some kind of fee — a management fee, a trading commission, or both. These fees seem small but compound over decades, so comparing costs before investing can make a real difference to your long-term returns.`}, he:{t:`עמלות השקעה`,b:`כל חשבון השקעות או קרן גובים סוג כלשהו של עמלה — דמי ניהול, עמלת מסחר, או שניהם. העמלות האלה נראות קטנות אך מצטברות לאורך עשורים, כך שהשוואת עלויות לפני ההשקעה יכולה לעשות הבדל אמיתי בתשואות לטווח ארוך.`}, ar:{t:`رسوم الاستثمار`,b:`كل حساب استثماري أو صندوق يفرض نوعاً من الرسوم — رسوم إدارة، أو عمولة تداول، أو كليهما. تبدو هذه الرسوم صغيرة لكنها تتراكم على مدى عقود، لذا فإن مقارنة التكاليف قبل الاستثمار يمكن أن تُحدث فرقاً حقيقياً في عوائدك طويلة المدى.`}}
  ]},
  {name:{en:'Strategy & Safety', he:'אסטרטגיה ובטיחות', ar:'الاستراتيجية والأمان'}, topics:[
   {id:'long-vs-short-term', en:{t:`Long-Term vs. Short-Term Investing`,b:`Short-term investing tries to profit from price moves within days or months, and is riskier and harder to do well. Long-term investing — holding for years — smooths out ups and downs and is generally the more reliable path for most people.`}, he:{t:`השקעה לטווח ארוך מול קצר`,b:`השקעה לטווח קצר מנסה להרוויח משינויי מחיר תוך ימים או חודשים, והיא מסוכנת יותר וקשה יותר לבצע היטב. השקעה לטווח ארוך — החזקה לאורך שנים — מחליקה עליות וירידות, וברוב המקרים היא הדרך האמינה יותר.`}, ar:{t:`الاستثمار طويل المدى مقابل قصير المدى`,b:`يحاول الاستثمار قصير المدى الربح من تحركات الأسعار خلال أيام أو أشهر، وهو أكثر مخاطرة وأصعب في التنفيذ الجيد. الاستثمار طويل المدى — الاحتفاظ لسنوات — يُخفف من التقلبات صعوداً وهبوطاً، وهو عموماً الطريق الأكثر موثوقية لمعظم الناس.`}},
   {id:'investment-scams-1', en:{t:`Common Investment Scams`,b:`Watch for promises of "guaranteed" high returns, pressure to invest immediately, and people you've never met contacting you about a "sure thing." Real investments always carry risk — anyone claiming otherwise is likely trying to take your money.`}, he:{t:`הונאות השקעה נפוצות`,b:`שימו לב להבטחות לתשואות גבוהות "מובטחות", לחץ להשקיע מיד, ואנשים שמעולם לא פגשתם שפונים אליכם לגבי "עסקה בטוחה". השקעות אמיתיות תמיד כרוכות בסיכון — כל מי שטוען אחרת כנראה מנסה לקחת לכם את הכסף.`}, ar:{t:`احتيالات الاستثمار الشائعة`,b:`احذر من الوعود بعوائد عالية "مضمونة"، والضغط للاستثمار فوراً، وأشخاص لم تلتقِ بهم قط يتواصلون معك بشأن "صفقة أكيدة". الاستثمارات الحقيقية تنطوي دائماً على مخاطرة — أي شخص يدّعي عكس ذلك يحاول على الأرجح أخذ مالك.`}},
   {id:'what-makes-risky', en:{t:`What Makes an Investment Risky?`,b:`Risk comes from things like uncertainty about the future, how easily you can sell the investment, how much debt is involved, and how much information you actually have. The less you understand something, the riskier it usually is for you personally.`}, he:{t:`מה הופך השקעה למסוכנת?`,b:`הסיכון נובע מדברים כמו אי-ודאות לגבי העתיד, עד כמה קל למכור את ההשקעה, כמה חוב מעורב, וכמה מידע יש לכם בפועל. ככל שאתם מבינים משהו פחות, כך הוא בדרך כלל מסוכן יותר עבורכם באופן אישי.`}, ar:{t:`ما الذي يجعل الاستثمار محفوفاً بالمخاطر؟`,b:`تنبع المخاطرة من أمور مثل عدم اليقين بشأن المستقبل، ومدى سهولة بيع الاستثمار، وحجم الديون المتضمنة، وكمية المعلومات التي تملكها فعلاً. كلما فهمت الشيء أقل، كان عادةً أكثر خطورة عليك شخصياً.`}}
  ]}
 ]}
,
{id:'banking', icon:'🏦', color:'#1D7A82', name:{en:'Banking in Israel', he:'בנקאות בישראל', ar:'الخدمات المصرفية في إسرائيل'},
 subs:[
  {name:{en:'Accounts', he:'חשבונות', ar:'الحسابات'}, topics:[
   {id:'bank-account', en:{t:`What Is a Bank Account?`,b:`A bank account is a place where a bank holds your money for you, keeps track of it, and lets you access it through cards, transfers, or a teller. In Israel, most people open their first account as a teenager, often with a parent.`}, he:{t:`מהו חשבון בנק?`,b:`חשבון בנק הוא מקום שבו הבנק מחזיק את הכסף שלכם עבורכם, עוקב אחריו, ומאפשר לכם לגשת אליו דרך כרטיסים, העברות או פקיד. בישראל, רוב האנשים פותחים את החשבון הראשון שלהם כבני נוער, לרוב יחד עם הורה.`}, ar:{t:`ما هو الحساب البنكي؟`,b:`الحساب البنكي هو مكان يحتفظ فيه البنك بمالك نيابة عنك، ويتتبعه، ويتيح لك الوصول إليه عبر البطاقات أو التحويلات أو الموظف. في إسرائيل، يفتح معظم الناس حسابهم الأول في سن المراهقة، غالباً مع أحد الوالدين.`}},
   {id:'checking-account', en:{t:`Checking Account (Oveh-Sh, עו"ש)`,b:`An "oveh-sh" is Israel's everyday bank account — used for receiving salary, paying bills, and daily spending via debit card or transfer. It's the account most Israelis use for money that's actively moving in and out.`}, he:{t:`חשבון עו"ש`,b:`עו"ש הוא חשבון הבנק היומיומי של ישראל — משמש לקבלת משכורת, תשלום חשבונות והוצאה יומיומית דרך כרטיס חיוב או העברה. זהו החשבון שרוב הישראלים משתמשים בו לכסף שנכנס ויוצא באופן פעיל.`}, ar:{t:`الحساب الجاري (עו"ש)`,b:`"أوفيش" (עו"ש) هو الحساب البنكي اليومي في إسرائيل — يُستخدم لاستلام الراتب، ودفع الفواتير، والإنفاق اليومي عبر بطاقة الخصم أو التحويل. إنه الحساب الذي يستخدمه معظم الإسرائيليين للمال الذي يدخل ويخرج بشكل نشط.`}},
   {id:'banking-savings-accounts', en:{t:`Savings Accounts (at the Bank)`,b:`Beyond your everyday checking account, Israeli banks offer separate savings accounts for money you want to set apart. They typically pay a bit of interest and are easy to open right alongside your main account.`}, he:{t:`חשבונות חיסכון (בבנק)`,b:`מעבר לחשבון העו"ש היומיומי, בנקים בישראל מציעים חשבונות חיסכון נפרדים לכסף שתרצו להפריש בצד. הם בדרך כלל משלמים מעט ריבית וקל לפתוח אותם לצד החשבון הראשי.`}, ar:{t:`حسابات التوفير (في البنك)`,b:`إلى جانب حسابك الجاري اليومي، تقدّم البنوك الإسرائيلية حسابات توفير منفصلة للمال الذي تريد فصله جانباً. عادةً ما تدفع بعض الفائدة ومن السهل فتحها بجانب حسابك الرئيسي.`}},
   {id:'banking-deposits', en:{t:`Deposits (Pikadon)`,b:`A pikadon at a bank locks money away for a fixed period in exchange for a set interest rate, agreed in advance. Banks offer many types, varying in length and rate — comparing a few before choosing usually pays off.`}, he:{t:`פיקדונות`,b:`פיקדון בבנק נועל כסף לתקופה קבועה בתמורה לריבית קבועה, שסוכמה מראש. בנקים מציעים סוגים רבים, שנבדלים באורך ובריבית — כדאי להשוות כמה לפני הבחירה.`}, ar:{t:`الودائع (بيكادون)`,b:`تقفل الوديعة في البنك المال لفترة محددة مقابل معدل فائدة ثابت متفق عليه مسبقاً. تقدّم البنوك أنواعاً عديدة، تختلف في المدة والمعدل — مقارنة عدة خيارات قبل الاختيار عادةً ما تكون مفيدة.`}}
  ]},
  {name:{en:'Costs & Interest', he:'עלויות וריבית', ar:'التكاليف والفائدة'}, topics:[
   {id:'bank-fees', en:{t:`Bank Fees`,b:`Israeli banks can charge fees for things like account maintenance, transfers, or using another bank's ATM. Many banks offer fee-free accounts for people under a certain age — worth checking before choosing where to bank.`}, he:{t:`עמלות בנק`,b:`בנקים בישראל יכולים לגבות עמלות עבור דברים כמו ניהול חשבון, העברות, או שימוש בכספומט של בנק אחר. בנקים רבים מציעים חשבונות ללא עמלות לאנשים מתחת לגיל מסוים — כדאי לבדוק לפני שבוחרים היכן לנהל חשבון.`}, ar:{t:`الرسوم البنكية`,b:`يمكن للبنوك الإسرائيلية فرض رسوم على أشياء مثل صيانة الحساب أو التحويلات أو استخدام صراف آلي لبنك آخر. تقدّم بنوك كثيرة حسابات بدون رسوم للأشخاص دون سن معينة — يستحق التحقق من ذلك قبل اختيار مكان فتح الحساب.`}},
   {id:'bank-interest', en:{t:`Interest (at the Bank)`,b:`Banks pay interest on money you keep with them (like in a savings account) and charge interest on money they lend you (like an overdraft). The interest rate a bank offers is often tied to the Bank of Israel's base rate.`}, he:{t:`ריבית (בבנק)`,b:`בנקים משלמים ריבית על כסף ששומרים אצלם (כמו בחשבון חיסכון) וגובים ריבית על כסף שהם מלווים לכם (כמו משיכת יתר). הריבית שבנק מציע קשורה לרוב לריבית הבסיס של בנק ישראל.`}, ar:{t:`الفائدة (في البنك)`,b:`تدفع البنوك فائدة على المال الذي تحتفظ به لديها (مثل حساب التوفير) وتفرض فائدة على المال الذي تُقرضه لك (مثل السحب على المكشوف). غالباً ما ترتبط الفائدة التي يقدمها البنك بسعر الفائدة الأساسي لبنك إسرائيل.`}}
  ]},
  {name:{en:'Moving Money', he:'העברת כסף', ar:'تحريك الأموال'}, topics:[
   {id:'bank-transfers', en:{t:`Bank Transfers`,b:`A bank transfer moves money electronically from one account to another, without cash or a check. In Israel this is often done through apps like Bit or through the bank's own app, and is now the most common way people pay each other back.`}, he:{t:`העברות בנקאיות`,b:`העברה בנקאית מזיזה כסף באופן אלקטרוני מחשבון אחד לאחר, בלי מזומן או צ'ק. בישראל זה נעשה לרוב דרך אפליקציות כמו ביט או דרך אפליקציית הבנק עצמו, וזו כיום הדרך הנפוצה ביותר שבה אנשים מחזירים כסף אחד לשני.`}, ar:{t:`التحويلات البنكية`,b:`يُحرّك التحويل البنكي المال إلكترونياً من حساب إلى آخر، دون نقد أو شيك. في إسرائيل، يتم ذلك غالباً عبر تطبيقات مثل "بيت" أو عبر تطبيق البنك نفسه، وهذه هي الآن الطريقة الأكثر شيوعاً لتسديد الأموال بين الأشخاص.`}},
   {id:'standing-orders', en:{t:`Standing Orders (Hora'at Keva)`,b:`A hora'at keva is an instruction you give your bank to automatically pay a fixed amount regularly — like a phone bill or gym membership — without you doing anything each time. It's convenient, but worth reviewing occasionally so you're not paying for something you forgot about.`}, he:{t:`הוראות קבע`,b:`הוראת קבע היא הוראה שנותנים לבנק לשלם באופן אוטומטי סכום קבוע באופן קבוע — כמו חשבון טלפון או מנוי לחדר כושר — בלי לעשות דבר בכל פעם. זה נוח, אבל כדאי לבדוק מדי פעם שלא משלמים על משהו ששכחתם ממנו.`}, ar:{t:`أوامر الدفع الدائمة (הוראת קבע)`,b:`"أمر الدفع الدائم" هو تعليمات تعطيها لبنكك لدفع مبلغ ثابت بشكل منتظم وتلقائي — مثل فاتورة هاتف أو اشتراك نادٍ رياضي — دون أن تفعل شيئاً في كل مرة. إنه مريح، لكن يستحق مراجعته أحياناً حتى لا تدفع مقابل شيء نسيته.`}},
   {id:'iban', en:{t:`What Is an IBAN?`,b:`An IBAN (International Bank Account Number) is a standardized code that identifies your exact bank account internationally, including the country, bank, and account number. You'll need it to receive money from abroad or send money internationally.`}, he:{t:`מהו IBAN?`,b:`IBAN (מספר חשבון בנק בינלאומי) הוא קוד סטנדרטי שמזהה את חשבון הבנק המדויק שלכם ברמה הבינלאומית, כולל המדינה, הבנק ומספר החשבון. תזדקקו לו כדי לקבל כסף מחו"ל או לשלוח כסף בינלאומית.`}, ar:{t:`ما هو رقم الآيبان (IBAN)؟`,b:`رقم الآيبان هو رمز موحّد يحدد حسابك البنكي بدقة على المستوى الدولي، بما في ذلك الدولة والبنك ورقم الحساب. ستحتاجه لاستلام أموال من الخارج أو إرسال أموال دولياً.`}}
  ]},
  {name:{en:'The Bigger Picture', he:'התמונה הגדולה', ar:'الصورة الأكبر'}, topics:[
   {id:'bank-of-israel', en:{t:`What Is the Bank of Israel?`,b:`The Bank of Israel is the country's central bank — it doesn't serve individual customers, but it sets the interest rate that influences every other rate in the economy, and works to keep prices and the financial system stable.`}, he:{t:`מהו בנק ישראל?`,b:`בנק ישראל הוא הבנק המרכזי של המדינה — הוא לא משרת לקוחות פרטיים, אבל הוא קובע את ריבית הבסיס שמשפיעה על כל שאר הריביות במשק, ופועל לשמור על יציבות המחירים והמערכת הפיננסית.`}, ar:{t:`ما هو بنك إسرائيل؟`,b:`بنك إسرائيل هو البنك المركزي للدولة — لا يخدم العملاء الأفراد، لكنه يحدد سعر الفائدة الذي يؤثر على كل الأسعار الأخرى في الاقتصاد، ويعمل على الحفاظ على استقرار الأسعار والنظام المالي.`}},
   {id:'how-banks-make-money', en:{t:`How Banks Make Money`,b:`Banks profit mainly from the gap between the (low) interest they pay savers and the (higher) interest they charge borrowers, plus fees for services. Understanding this helps explain why banks encourage both saving and borrowing.`}, he:{t:`איך בנקים מרוויחים כסף`,b:`בנקים מרוויחים בעיקר מהפער בין הריבית (הנמוכה) שהם משלמים לחוסכים לבין הריבית (הגבוהה יותר) שהם גובים מלווים, בתוספת עמלות על שירותים. הבנת זה עוזרת להסביר למה בנקים מעודדים גם חיסכון וגם הלוואות.`}, ar:{t:`كيف تجني البنوك المال`,b:`تربح البنوك بشكل رئيسي من الفارق بين الفائدة (المنخفضة) التي تدفعها للمدخرين والفائدة (الأعلى) التي تفرضها على المقترضين، بالإضافة إلى رسوم الخدمات. فهم هذا يساعد على تفسير لماذا تشجع البنوك على الادخار والاقتراض معاً.`}}
  ]}
 ]}
,
{id:'taxes', icon:'🧾', color:'#6B4A85', name:{en:'Taxes in Israel', he:'מיסים בישראל', ar:'الضرائب في إسرائيل'},
 subs:[
  {name:{en:'Basics', he:'יסודות', ar:'الأساسيات'}, topics:[
   {id:'what-is-tax', en:{t:`What Is a Tax?`,b:`A tax is money the government collects from individuals and businesses to fund public services — schools, hospitals, roads, defense, and more. Nearly everyone in Israel pays some form of tax, even without realizing it, every time they buy something.`}, he:{t:`מהו מס?`,b:`מס הוא כסף שהממשלה גובה מיחידים ועסקים כדי לממן שירותים ציבוריים — בתי ספר, בתי חולים, כבישים, ביטחון ועוד. כמעט כל אחד בישראל משלם איזשהו מס, גם בלי לשים לב, בכל פעם שקונים משהו.`}, ar:{t:`ما هي الضريبة؟`,b:`الضريبة هي مال تجمعه الحكومة من الأفراد والشركات لتمويل الخدمات العامة — المدارس والمستشفيات والطرق والدفاع وغيرها. يدفع كل شخص تقريباً في إسرائيل نوعاً من الضرائب، حتى دون أن يلاحظ، في كل مرة يشتري فيها شيئاً.`}},
   {id:'why-taxes-exist', en:{t:`Why Do Taxes Exist?`,b:`Without taxes, there'd be no public funding for things individuals can't easily provide for themselves — like national defense, public hospitals, or roads everyone can use. Taxes are how a country pools resources for things that benefit everyone together.`}, he:{t:`למה יש מיסים?`,b:`בלי מיסים, לא היה מימון ציבורי לדברים שיחידים לא יכולים לספק לעצמם בקלות — כמו ביטחון לאומי, בתי חולים ציבוריים או כבישים שכולם יכולים להשתמש בהם. מיסים הם הדרך שבה מדינה מאגדת משאבים לדברים שמועילים לכולם יחד.`}, ar:{t:`لماذا توجد الضرائب؟`,b:`بدون الضرائب، لن يكون هناك تمويل عام للأشياء التي لا يستطيع الأفراد توفيرها لأنفسهم بسهولة — مثل الدفاع الوطني أو المستشفيات العامة أو الطرق التي يستخدمها الجميع. الضرائب هي طريقة الدولة لتجميع الموارد لأشياء تفيد الجميع معاً.`}}
  ]},
  {name:{en:'Income Tax', he:'מס הכנסה', ar:'ضريبة الدخل'}, topics:[
   {id:'income-tax', en:{t:`Income Tax (Mas Hachnasa)`,b:`Income tax is a percentage of your income paid to the government, and in Israel it's progressive — meaning the more you earn, the higher the rate on your top portion of income. It's usually deducted automatically from an employee's salary each month.`}, he:{t:`מס הכנסה`,b:`מס הכנסה הוא אחוז מההכנסה שלכם המשולם לממשלה, ובישראל הוא פרוגרסיבי — כלומר ככל שמרוויחים יותר, כך שיעור המס על החלק העליון של ההכנסה גבוה יותר. הוא בדרך כלל מנוכה אוטומטית ממשכורת העובד מדי חודש.`}, ar:{t:`ضريبة الدخل (מס הכנסה)`,b:`ضريبة الدخل هي نسبة مئوية من دخلك تُدفع للحكومة، وهي في إسرائيل تصاعدية — أي كلما زاد دخلك، ارتفعت نسبة الضريبة على الجزء الأعلى من دخلك. عادةً ما تُخصم تلقائياً من راتب الموظف كل شهر.`}},
   {id:'tax-brackets', en:{t:`Tax Brackets`,b:`Israel's income tax is split into brackets, each taxed at a different rate — roughly from 10% on the lowest portion of income up to 50% on the highest. You don't pay the top rate on all your income, only on the portion that falls in that bracket.`}, he:{t:`מדרגות מס`,b:`מס ההכנסה בישראל מחולק למדרגות, וכל אחת ממוסה בשיעור שונה — בערך מ-10% על החלק הנמוך ביותר של ההכנסה עד 50% על החלק הגבוה ביותר. לא משלמים את השיעור העליון על כל ההכנסה, רק על החלק שנופל באותה מדרגה.`}, ar:{t:`الشرائح الضريبية`,b:`تنقسم ضريبة الدخل في إسرائيل إلى شرائح، تُفرض على كل منها نسبة مختلفة — من حوالي 10% على الجزء الأدنى من الدخل إلى 50% على الجزء الأعلى. أنت لا تدفع أعلى نسبة على كامل دخلك، بل فقط على الجزء الذي يقع ضمن تلك الشريحة.`}},
   {id:'tax-credits', en:{t:`Tax Credits (Nekudot Zikuy)`,b:`A "nekudat zikuy" is a tax credit point — a fixed amount subtracted directly from the tax you owe, not from your income. Every Israeli resident gets a baseline number of points, and certain groups (like new workers or parents) get extra ones.`}, he:{t:`נקודות זיכוי`,b:`נקודת זיכוי היא סכום קבוע שמנוכה ישירות מהמס שאתם חייבים, לא מההכנסה שלכם. לכל תושב ישראלי יש מספר בסיסי של נקודות, וקבוצות מסוימות (כמו עובדים חדשים או הורים) מקבלות נקודות נוספות.`}, ar:{t:`نقاط الإعفاء الضريبي (נקודות זיכוי)`,b:`"نقطة الإعفاء" هي مبلغ ثابت يُخصم مباشرة من الضريبة المستحقة عليك، وليس من دخلك. يحصل كل مقيم إسرائيلي على عدد أساسي من النقاط، وتحصل فئات معينة مثل العمال الجدد أو الآباء على نقاط إضافية.`}}
  ]},
  {name:{en:'Other Taxes', he:'מיסים נוספים', ar:'ضرائب أخرى'}, topics:[
   {id:'vat', en:{t:`VAT (Ma'am)`,b:`VAT — Value Added Tax, known as "ma'am" in Israel — is a tax added to the price of most goods and services, currently 18%. Unlike income tax, everyone pays the same rate regardless of how much they earn, since it's built into the price you see.`}, he:{t:`מע"מ`,b:`מע"מ (מס ערך מוסף) הוא מס שמתווסף למחיר של רוב הסחורות והשירותים, כיום 18%. בניגוד למס הכנסה, כולם משלמים את אותו שיעור בלי קשר לכמה הם מרוויחים, כי הוא כלול במחיר שרואים.`}, ar:{t:`ضريبة القيمة المضافة (מע"מ)`,b:`ضريبة القيمة المضافة — المعروفة في إسرائيل بـ"מע"מ" — هي ضريبة تُضاف إلى سعر معظم السلع والخدمات، وهي حالياً 18%. على عكس ضريبة الدخل، يدفع الجميع نفس النسبة بغض النظر عن دخلهم، لأنها مدمجة في السعر الذي تراه.`}},
   {id:'national-insurance', en:{t:`National Insurance (Bituach Leumi)`,b:`Bituach Leumi is a mandatory payment, deducted alongside income tax, that funds things like unemployment benefits, disability support, child allowances, and pensions. Both employees and employers contribute a percentage of the salary.`}, he:{t:`ביטוח לאומי`,b:`ביטוח לאומי הוא תשלום חובה, שמנוכה לצד מס הכנסה, שמממן דברים כמו דמי אבטלה, קצבת נכות, קצבאות ילדים וקצבאות זקנה. גם העובד וגם המעסיק תורמים אחוז מהמשכורת.`}, ar:{t:`التأمين الوطني (ביטוח לאומי)`,b:`"بيتواح لؤومي" هو دفعة إلزامية، تُخصم إلى جانب ضريبة الدخل، وتموّل أشياء مثل إعانات البطالة ودعم الإعاقة وبدلات الأطفال ومعاشات التقاعد. يساهم كل من الموظف وصاحب العمل بنسبة من الراتب.`}},
   {id:'tax-on-investments', en:{t:`Tax on Investments`,b:`In Israel, profit made from investments is generally taxed — usually 25% on the gain when you sell for more than you paid. This applies whether the profit came from stocks, funds, or most other investment types.`}, he:{t:`מס על השקעות`,b:`בישראל, רווח שנוצר מהשקעות ממוסה בדרך כלל — לרוב 25% על הרווח כשמוכרים ביותר ממה ששילמתם. זה חל בין אם הרווח הגיע ממניות, קרנות, או רוב סוגי ההשקעות האחרים.`}, ar:{t:`الضريبة على الاستثمارات`,b:`في إسرائيل، تُفرض عادةً ضريبة على الربح الناتج عن الاستثمارات — عادةً 25% على الربح عند البيع بأكثر مما دفعت. ينطبق هذا سواء جاء الربح من الأسهم أو الصناديق أو معظم أنواع الاستثمارات الأخرى.`}},
   {id:'tax-on-interest', en:{t:`Tax on Interest`,b:`Interest you earn — like from a savings account or a pikadon — is also taxable in Israel, generally at around 15-25% depending on the type of account. Banks often deduct this automatically before the interest even reaches your balance.`}, he:{t:`מס על ריבית`,b:`גם ריבית שמרוויחים — כמו מחשבון חיסכון או פיקדון — חייבת במס בישראל, בדרך כלל בסביבות 15-25% תלוי בסוג החשבון. בנקים לרוב מנכים את זה אוטומטית עוד לפני שהריבית מגיעה ליתרה שלכם.`}, ar:{t:`الضريبة على الفائدة`,b:`الفائدة التي تكسبها — مثل تلك من حساب توفير أو وديعة — تخضع أيضاً للضريبة في إسرائيل، عادةً بنسبة تتراوح بين 15-25% حسب نوع الحساب. غالباً ما تخصم البنوك ذلك تلقائياً قبل وصول الفائدة إلى رصيدك أصلاً.`}},
   {id:'tax-on-capital-gains', en:{t:`Tax on Capital Gains`,b:`Capital gains tax applies specifically to the profit from selling an asset that increased in value — like a stock or property. In Israel, the standard rate for individuals is 25%, though real estate has its own separate rules.`}, he:{t:`מס רווחי הון`,b:`מס רווחי הון חל באופן ספציפי על הרווח ממכירת נכס שעלה בערכו — כמו מניה או נכס נדל"ן. בישראל, השיעור הסטנדרטי ליחידים הוא 25%, אם כי לנדל"ן יש כללים נפרדים משלו.`}, ar:{t:`ضريبة الأرباح الرأسمالية`,b:`تُطبَّق ضريبة الأرباح الرأسمالية تحديداً على الربح من بيع أصل ازدادت قيمته — مثل سهم أو عقار. في إسرائيل، النسبة القياسية للأفراد هي 25%، رغم أن للعقارات قواعدها المنفصلة الخاصة.`}}
  ]},
  {name:{en:'Real Life', he:'החיים האמיתיים', ar:'الحياة الواقعية'}, topics:[
   {id:'understanding-payslip', en:{t:`Understanding a Payslip`,b:`A payslip (tlush maskoret) shows your gross salary, all the deductions (tax, National Insurance, pension), and what's left — your net salary. Reading it carefully each month helps you catch mistakes and understand exactly where your money goes.`}, he:{t:`הבנת תלוש שכר`,b:`תלוש שכר מציג את המשכורת ברוטו שלכם, את כל הניכויים (מס, ביטוח לאומי, פנסיה), ומה שנשאר — המשכורת נטו. קריאה מדוקדקת שלו מדי חודש עוזרת לתפוס טעויות ולהבין בדיוק לאן הכסף שלכם הולך.`}, ar:{t:`فهم قسيمة الراتب`,b:`تُظهر قسيمة الراتب (تلوش ماسكوريت) راتبك الإجمالي، وجميع الخصومات (الضريبة، التأمين الوطني، التقاعد)، وما يتبقى — راتبك الصافي. قراءتها بعناية كل شهر تساعدك على اكتشاف الأخطاء وفهم أين يذهب مالك بالضبط.`}},
   {id:'salary-after-deductions', en:{t:`Why Your Salary Changes After Deductions`,b:`The number on your job offer is usually your gross salary — before tax, National Insurance, and pension are subtracted. Your net salary, what actually lands in your bank account, is typically noticeably lower, which is worth planning for.`}, he:{t:`למה המשכורת שלכם משתנה אחרי ניכויים`,b:`המספר שמופיע בהצעת העבודה הוא בדרך כלל המשכורת ברוטו שלכם — לפני שמנכים מס, ביטוח לאומי ופנסיה. המשכורת נטו, זו שבאמת נכנסת לחשבון הבנק, בדרך כלל נמוכה יותר באופן ניכר, וכדאי לתכנן לפי זה.`}, ar:{t:`لماذا يتغير راتبك بعد الخصومات`,b:`الرقم الذي يظهر في عرض العمل هو عادةً راتبك الإجمالي — قبل خصم الضريبة والتأمين الوطني والتقاعد. راتبك الصافي، الذي يصل فعلياً إلى حسابك البنكي، عادةً ما يكون أقل بشكل ملحوظ، وهذا يستحق التخطيط له.`}},
   {id:'who-pays-taxes', en:{t:`Who Actually Pays Which Taxes?`,b:`Employees have income tax and National Insurance deducted automatically by their employer. Everyone, including kids, pays VAT on purchases. Self-employed people and investors are usually responsible for reporting and paying some taxes themselves, rather than having them deducted automatically.`}, he:{t:`מי בעצם משלם אילו מיסים?`,b:`לעובדים שכירים מנוכים מס הכנסה וביטוח לאומי אוטומטית על ידי המעסיק. כולם, כולל ילדים, משלמים מע"מ על קניות. עצמאים ומשקיעים בדרך כלל אחראים לדווח ולשלם חלק מהמיסים בעצמם, במקום שינוכו אוטומטית.`}, ar:{t:`من يدفع فعلياً أي ضرائب؟`,b:`يُخصم من الموظفين ضريبة الدخل والتأمين الوطني تلقائياً من قبل صاحب العمل. يدفع الجميع، بمن فيهم الأطفال، ضريبة القيمة المضافة عند الشراء. عادةً ما يكون العاملون لحسابهم الخاص والمستثمرون مسؤولين عن الإبلاغ ودفع بعض الضرائب بأنفسهم، بدلاً من خصمها تلقائياً.`}}
  ]}
 ]}
,
{id:'working', icon:'💼', color:'#C1662E', name:{en:'Working & Getting Paid', he:'עבודה וקבלת שכר', ar:'العمل وتقاضي الأجر'},
 subs:[
  {name:{en:'Your Paycheck', he:'המשכורת שלכם', ar:'راتبك'}, topics:[
   {id:'payslip-basics', en:{t:`Payslips (Tlush Maskoret)`,b:`A payslip is the official document your employer gives you each month, showing exactly how much you earned and what was taken out. By Israeli law, every employee must receive one — keep them, since you may need them for loans, taxes, or benefits.`}, he:{t:`תלושי שכר`,b:`תלוש שכר הוא המסמך הרשמי שהמעסיק נותן לכם מדי חודש, ומראה בדיוק כמה הרווחתם ומה נוכה. על פי חוק ישראלי, כל עובד חייב לקבל תלוש — כדאי לשמור אותם, כי ייתכן שתזדקקו להם להלוואות, מיסים או הטבות.`}, ar:{t:`قسائم الراتب (تلوش ماسكوريت)`,b:`قسيمة الراتب هي المستند الرسمي الذي يمنحك إياه صاحب العمل كل شهر، ويُظهر بالضبط كم كسبت وما الذي خُصم. بموجب القانون الإسرائيلي، يجب أن يحصل كل موظف على واحدة — احتفظ بها، فقد تحتاجها للقروض أو الضرائب أو المزايا.`}},
   {id:'gross-net', en:{t:`Gross vs. Net Salary`,b:`Gross salary is your full pay before anything is subtracted. Net salary is what you actually receive after tax, National Insurance, and pension contributions are deducted. When comparing job offers, always ask which number you're looking at.`}, he:{t:`משכורת ברוטו מול נטו`,b:`משכורת ברוטו היא השכר המלא לפני שמנכים ממנו כלום. משכורת נטו היא מה שאתם באמת מקבלים אחרי ניכוי מס, ביטוח לאומי והפרשות פנסיה. כשמשווים הצעות עבודה, תמיד כדאי לשאול איזה מספר רואים.`}, ar:{t:`الراتب الإجمالي مقابل الصافي`,b:`الراتب الإجمالي هو الأجر الكامل قبل خصم أي شيء منه. الراتب الصافي هو ما تستلمه فعلياً بعد خصم الضريبة والتأمين الوطني ومساهمات التقاعد. عند مقارنة عروض العمل، اسأل دائماً عن الرقم الذي تنظر إليه.`}},
   {id:'understanding-paycheck', en:{t:`Understanding Your Paycheck`,b:`Between the job offer and the money in your account sit several deductions: income tax, National Insurance, and often pension contributions. Understanding each line means fewer surprises and better planning for what you'll actually have to spend.`}, he:{t:`הבנת המשכורת שלכם`,b:`בין הצעת העבודה לכסף בחשבון שלכם עומדים כמה ניכויים: מס הכנסה, ביטוח לאומי ולעיתים קרובות הפרשות לפנסיה. הבנת כל שורה משמעה פחות הפתעות ותכנון טוב יותר של מה שבאמת יהיה לכם להוציא.`}, ar:{t:`فهم راتبك`,b:`بين عرض العمل والمال في حسابك تقع عدة خصومات: ضريبة الدخل، والتأمين الوطني، وغالباً مساهمات التقاعد. فهم كل بند يعني مفاجآت أقل وتخطيطاً أفضل لما ستملكه فعلاً لإنفاقه.`}}
  ]},
  {name:{en:'What Gets Deducted', he:'מה מנוכה', ar:'ما الذي يُخصم'}, topics:[
   {id:'income-tax-working', en:{t:`Income Tax When Working`,b:`As an employee, income tax is calculated automatically each pay period based on your salary and tax credit points, and deducted before you're paid. Many young or part-time workers earn below the taxable threshold and pay little or no income tax at all.`}, he:{t:`מס הכנסה כשעובדים`,b:`כעובד שכיר, מס ההכנסה מחושב אוטומטית בכל תקופת תשלום לפי המשכורת ונקודות הזיכוי שלכם, ומנוכה לפני שמשלמים לכם. עובדים צעירים או במשרה חלקית רבים מרוויחים מתחת לסף החייב במס ומשלמים מעט מס הכנסה או בכלל לא.`}, ar:{t:`ضريبة الدخل عند العمل`,b:`كموظف، تُحسب ضريبة الدخل تلقائياً في كل فترة دفع بناءً على راتبك ونقاط الإعفاء الضريبي الخاصة بك، وتُخصم قبل أن تُدفع لك. كثير من العمال الشباب أو بدوام جزئي يكسبون أقل من الحد الخاضع للضريبة ويدفعون ضريبة دخل قليلة أو لا يدفعون شيئاً.`}},
   {id:'ni-deductions', en:{t:`National Insurance Deductions`,b:`A percentage of your salary goes to National Insurance automatically, funding benefits you and others may need someday — from maternity leave to unemployment support. Employers also contribute an additional amount on top of your salary.`}, he:{t:`ניכויי ביטוח לאומי`,b:`אחוז מהמשכורת שלכם הולך אוטומטית לביטוח לאומי, ומממן הטבות שאתם ואחרים עשויים להזדקק להן יום אחד — מחופשת לידה ועד תמיכה באבטלה. גם המעסיקים תורמים סכום נוסף מעל למשכורת שלכם.`}, ar:{t:`خصومات التأمين الوطني`,b:`تذهب نسبة من راتبك تلقائياً إلى التأمين الوطني، مموّلة مزايا قد تحتاجها أنت أو غيرك يوماً ما — من إجازة الأمومة إلى دعم البطالة. يساهم أصحاب العمل أيضاً بمبلغ إضافي فوق راتبك.`}},
   {id:'pension', en:{t:`Pension Contributions`,b:`By Israeli law, most employees must be enrolled in a pension plan, with both employee and employer contributing a percentage of the salary each month. This money is invested and grows over your working life to support you after retirement.`}, he:{t:`הפרשות פנסיה`,b:`על פי חוק ישראלי, רוב העובדים חייבים להיות רשומים לתוכנית פנסיה, כשגם העובד וגם המעסיק מפרישים אחוז מהמשכורת מדי חודש. הכסף הזה מושקע וגדל לאורך שנות העבודה שלכם כדי לתמוך בכם אחרי הפרישה.`}, ar:{t:`مساهمات التقاعد`,b:`بموجب القانون الإسرائيلي، يجب تسجيل معظم الموظفين في خطة تقاعد، حيث يساهم كل من الموظف وصاحب العمل بنسبة من الراتب كل شهر. يُستثمر هذا المال وينمو على مدى سنوات عملك ليدعمك بعد التقاعد.`}}
  ]},
  {name:{en:'Know Your Rights', he:'הכירו את הזכויות שלכם', ar:'اعرف حقوقك'}, topics:[
   {id:'minimum-wage', en:{t:`Minimum Wage in Israel`,b:`Israel sets a national minimum wage by law, currently about ₪6,444 per month (or roughly ₪35.40 per hour) for full-time work, reviewed periodically. No employer can legally pay less, even during a trial period.`}, he:{t:`שכר מינימום בישראל`,b:`בישראל קיים שכר מינימום ארצי הקבוע בחוק, כיום כ-6,444 ₪ לחודש (או כ-35.40 ₪ לשעה) למשרה מלאה, ומתעדכן מעת לעת. שום מעסיק לא רשאי לשלם פחות מכך, גם לא בתקופת ניסיון.`}, ar:{t:`الحد الأدنى للأجور في إسرائيل`,b:`تحدد إسرائيل حداً أدنى وطنياً للأجور بموجب القانون، حالياً حوالي 6,444 شيكل شهرياً (أو حوالي 35.40 شيكل للساعة) للدوام الكامل، ويُراجع دورياً. لا يجوز لأي صاحب عمل أن يدفع أقل من ذلك، حتى خلال فترة التجربة.`}},
   {id:'young-worker-credits', en:{t:`Tax Credits for Young Workers`,b:`Israel's tax system gives extra tax credit points to certain groups, which can mean young or new workers pay less tax than they otherwise would. Combined with a relatively high tax-free threshold, many teens and young workers end up owing very little income tax.`}, he:{t:`נקודות זיכוי לעובדים צעירים`,b:`מערכת המס בישראל נותנת נקודות זיכוי נוספות לקבוצות מסוימות, מה שיכול להוביל לכך שעובדים צעירים או חדשים משלמים פחות מס ממה שהיו משלמים אחרת. בשילוב עם סף פטור ממס גבוה יחסית, בני נוער ועובדים צעירים רבים נשארים חייבים מעט מאוד מס הכנסה.`}, ar:{t:`نقاط الإعفاء الضريبي للعمال الشباب`,b:`يمنح النظام الضريبي الإسرائيلي نقاط إعفاء إضافية لفئات معينة، ما قد يعني أن العمال الشباب أو الجدد يدفعون ضريبة أقل مما كانوا سيدفعونه لولا ذلك. مع الحد المعفى من الضريبة المرتفع نسبياً، ينتهي الأمر بكثير من المراهقين والعمال الشباب مدينين بضريبة دخل قليلة جداً.`}},
   {id:'employer-requirements', en:{t:`What an Employer Is Required to Provide`,b:`Israeli law requires employers to give a written payslip every month, pay at least minimum wage, contribute to pension and National Insurance, and provide paid vacation and sick days. Knowing these rights helps young workers spot when something's wrong.`}, he:{t:`מה מעסיק מחויב לספק`,b:`החוק בישראל מחייב מעסיקים לתת תלוש שכר בכתב מדי חודש, לשלם לפחות שכר מינימום, להפריש לפנסיה ולביטוח לאומי, ולספק ימי חופשה ומחלה בתשלום. הכרת הזכויות האלה עוזרת לעובדים צעירים לזהות כשמשהו לא בסדר.`}, ar:{t:`ما الذي يتوجب على صاحب العمل توفيره`,b:`يُلزم القانون الإسرائيلي أصحاب العمل بمنح قسيمة راتب مكتوبة كل شهر، ودفع الحد الأدنى للأجور على الأقل، والمساهمة في التقاعد والتأمين الوطني، وتوفير إجازات مدفوعة الأجر وأيام مرضية. معرفة هذه الحقوق تساعد العمال الشباب على ملاحظة متى يكون هناك خطأ ما.`}}
  ]}
 ]}
,
{id:'financial-system', icon:'🏛️', color:'#24406B', name:{en:'Israeli Financial System', he:'המערכת הפיננסית הישראלית', ar:'النظام المالي الإسرائيلي'},
 subs:[
  {name:{en:'The Regulators', he:'הרגולטורים', ar:'الجهات الرقابية'}, topics:[
   {id:'boi-role', en:{t:`Bank of Israel`,b:`As the central bank, the Bank of Israel sets the interest rate, manages currency reserves, and works to control inflation. Its decisions ripple through every mortgage, savings account, and loan in the country.`}, he:{t:`בנק ישראל`,b:`כבנק המרכזי, בנק ישראל קובע את הריבית, מנהל את יתרות המט"ח, ופועל לשליטה באינפלציה. ההחלטות שלו משפיעות על כל משכנתא, חשבון חיסכון והלוואה במדינה.`}, ar:{t:`بنك إسرائيل`,b:`بصفته البنك المركزي، يحدد بنك إسرائيل سعر الفائدة، ويدير احتياطيات العملة، ويعمل على السيطرة على التضخم. قراراته تؤثر على كل رهن عقاري وحساب توفير وقرض في البلاد.`}},
   {id:'securities-authority', en:{t:`Israel Securities Authority`,b:`The Israel Securities Authority regulates the stock market and investment industry, making sure companies disclose accurate information and investors are treated fairly. It's the watchdog that helps keep Israeli investing honest.`}, he:{t:`רשות ניירות ערך`,b:`רשות ניירות ערך מפקחת על שוק ההון ותעשיית ההשקעות, ומוודאת שחברות חושפות מידע מדויק ושמשקיעים מטופלים בהגינות. זהו "כלב השמירה" שעוזר לשמור על ההשקעות בישראל הוגנות.`}, ar:{t:`هيئة الأوراق المالية الإسرائيلية`,b:`تنظم هيئة الأوراق المالية الإسرائيلية سوق الأسهم وصناعة الاستثمار، وتتأكد من أن الشركات تكشف عن معلومات دقيقة ومن معاملة المستثمرين بإنصاف. إنها الجهة الرقابية التي تساعد على إبقاء الاستثمار في إسرائيل نزيهاً.`}},
   {id:'ministry-of-finance', en:{t:`Ministry of Finance`,b:`The Ministry of Finance manages the government's budget, decides tax policy, and plans how public money is spent. Every year's tax brackets, VAT rate, and government spending priorities trace back to decisions made here.`}, he:{t:`משרד האוצר`,b:`משרד האוצר מנהל את תקציב הממשלה, קובע מדיניות מיסוי, ומתכנן איך כסף ציבורי מוצא. מדרגות המס, שיעור המע"מ וסדרי העדיפויות בהוצאה הממשלתית של כל שנה נובעים מהחלטות שמתקבלות כאן.`}, ar:{t:`وزارة المالية`,b:`تدير وزارة المالية ميزانية الحكومة، وتقرر السياسة الضريبية، وتخطط لكيفية إنفاق المال العام. الشرائح الضريبية ومعدل ضريبة القيمة المضافة وأولويات الإنفاق الحكومي كل عام تعود إلى قرارات تُتخذ هنا.`}}
  ]},
  {name:{en:'Everyday Institutions', he:'מוסדות יומיומיים', ar:'المؤسسات اليومية'}, topics:[
   {id:'commercial-banks', en:{t:`Commercial Banks`,b:`Commercial banks — like Hapoalim, Leumi, or Discount — are the banks individuals and businesses actually use day to day, for accounts, loans, and cards. Unlike the Bank of Israel, they compete with each other for your business.`}, he:{t:`בנקים מסחריים`,b:`בנקים מסחריים — כמו הפועלים, לאומי או דיסקונט — הם הבנקים שיחידים ועסקים באמת משתמשים בהם יום-יום, לחשבונות, הלוואות וכרטיסים. בניגוד לבנק ישראל, הם מתחרים אחד בשני על הלקוחות שלכם.`}, ar:{t:`البنوك التجارية`,b:`البنوك التجارية — مثل هبوعليم أو لئومي أو ديسكونت — هي البنوك التي يستخدمها الأفراد والشركات فعلياً يومياً، للحسابات والقروض والبطاقات. على عكس بنك إسرائيل، تتنافس هذه البنوك فيما بينها على عملائك.`}},
   {id:'nii-institute', en:{t:`National Insurance Institute (Bituach Leumi)`,b:`This is the government body that collects National Insurance contributions and pays out benefits — unemployment, disability, child allowances, maternity leave, and pensions. It's a safety net funded by nearly everyone who works.`}, he:{t:`המוסד לביטוח לאומי`,b:`זהו הגוף הממשלתי שגובה דמי ביטוח לאומי ומשלם קצבאות — אבטלה, נכות, קצבאות ילדים, חופשת לידה וקצבאות זקנה. זוהי רשת ביטחון שממומנת על ידי כמעט כל מי שעובד.`}, ar:{t:`المؤسسة الوطنية للتأمين (ביטוח לאומי)`,b:`هذه هي الجهة الحكومية التي تجمع اشتراكات التأمين الوطني وتدفع المزايا — البطالة، الإعاقة، بدلات الأطفال، إجازة الأمومة، ومعاشات التقاعد. إنها شبكة أمان يموّلها تقريباً كل من يعمل.`}},
   {id:'tax-authority', en:{t:`Tax Authority (Rashut HaMisim)`,b:`The Israel Tax Authority collects income tax, VAT, and other taxes, and enforces tax law. If you're ever self-employed or need to report unusual income, this is the body you'll deal with directly.`}, he:{t:`רשות המסים`,b:`רשות המסים בישראל גובה מס הכנסה, מע"מ ומיסים אחרים, ואוכפת את חוקי המס. אם אי פעם תהיו עצמאים או תצטרכו לדווח על הכנסה חריגה, זהו הגוף שתתעסקו איתו ישירות.`}, ar:{t:`سلطة الضرائب (רשות המסים)`,b:`سلطة الضرائب الإسرائيلية تجمع ضريبة الدخل وضريبة القيمة المضافة وضرائب أخرى، وتُنفّذ قانون الضرائب. إذا كنت يوماً عاملاً لحسابك الخاص أو احتجت للإبلاغ عن دخل غير اعتيادي، فهذه هي الجهة التي ستتعامل معها مباشرة.`}}
  ]},
  {name:{en:'How It Connects', he:'איך זה מתחבר', ar:'كيف يترابط كل ذلك'}, topics:[
   {id:'what-each-does', en:{t:`What Each Organization Actually Does`,b:`The Bank of Israel manages money and inflation; the Securities Authority polices investing; the Finance Ministry sets budget and tax policy; National Insurance pays social benefits; the Tax Authority collects taxes. Each has a distinct, non-overlapping job.`}, he:{t:`מה כל ארגון עושה בפועל`,b:`בנק ישראל מנהל את הכסף והאינפלציה; רשות ניירות ערך משגיחה על ההשקעות; משרד האוצר קובע תקציב ומדיניות מיסוי; ביטוח לאומי משלם הטבות סוציאליות; רשות המסים גובה מיסים. לכל אחד תפקיד מובחן שלא חופף לאחרים.`}, ar:{t:`ما الذي تفعله كل جهة فعلياً`,b:`بنك إسرائيل يدير المال والتضخم؛ هيئة الأوراق المالية تراقب الاستثمار؛ وزارة المالية تحدد الميزانية والسياسة الضريبية؛ التأمين الوطني يدفع المزايا الاجتماعية؛ سلطة الضرائب تجمع الضرائب. لكل جهة دور مميز لا يتداخل مع الأخرى.`}},
   {id:'how-they-affect-you', en:{t:`How They Affect Your Money`,b:`Together, these institutions shape your paycheck (tax and National Insurance deductions), your savings (interest rates), and your future benefits (pensions and social support). None of them operate in isolation — they all touch your daily financial life.`}, he:{t:`איך הם משפיעים על הכסף שלכם`,b:`יחד, המוסדות האלה מעצבים את המשכורת שלכם (ניכויי מס וביטוח לאומי), את החיסכון שלכם (ריביות), ואת ההטבות העתידיות שלכם (פנסיה ותמיכה סוציאלית). אף אחד מהם לא פועל בבידוד — כולם נוגעים בחיים הפיננסיים היומיומיים שלכם.`}, ar:{t:`كيف تؤثر هذه الجهات على مالك`,b:`معاً، تُشكّل هذه المؤسسات راتبك (خصومات الضريبة والتأمين الوطني)، ومدخراتك (أسعار الفائدة)، ومزاياك المستقبلية (التقاعد والدعم الاجتماعي). لا تعمل أي منها بمعزل عن الأخرى — جميعها تلمس حياتك المالية اليومية.`}}
  ]}
 ]}
,
{id:'money-safety', icon:'⚠️', color:'#B0473A', name:{en:'Money Safety', he:'בטיחות כספית', ar:'السلامة المالية'},
 subs:[
  {name:{en:'Scams to Know', he:'הונאות שכדאי להכיר', ar:'احتيالات يجب معرفتها'}, topics:[
   {id:'scam-investment-general', en:{t:`Investment Scams`,b:`Investment scams promise fast, easy, high returns with little or no risk — which doesn't exist in real investing. Scammers often target people through social media, sounding confident and using real financial terms to seem legitimate.`}, he:{t:`הונאות השקעה`,b:`הונאות השקעה מבטיחות תשואות מהירות, קלות וגבוהות עם סיכון מועט או ללא סיכון בכלל — דבר שלא קיים בהשקעות אמיתיות. נוכלים לרוב מכוונים לאנשים דרך רשתות חברתיות, נשמעים בטוחים בעצמם ומשתמשים במונחים פיננסיים אמיתיים כדי להיראות לגיטימיים.`}, ar:{t:`احتيالات الاستثمار`,b:`تعِد احتيالات الاستثمار بعوائد سريعة وسهلة وعالية مع مخاطرة قليلة أو معدومة — وهو أمر غير موجود في الاستثمار الحقيقي. غالباً ما يستهدف المحتالون الأشخاص عبر وسائل التواصل الاجتماعي، بثقة ظاهرة واستخدام مصطلحات مالية حقيقية لكي يبدوا شرعيين.`}},
   {id:'fake-gurus', en:{t:`Fake Financial Gurus`,b:`Some online "experts" sell courses, signals, or advice claiming they'll make you rich fast, often showing fake screenshots of profits. Real financial education never guarantees results — anyone who does is selling something other than the truth.`}, he:{t:`"גורואים" פיננסיים מזויפים`,b:`"מומחים" מסוימים באינטרנט מוכרים קורסים, סיגנלים או עצות שטוענים שיעשירו אתכם מהר, לרוב תוך הצגת צילומי מסך מזויפים של רווחים. חינוך פיננסי אמיתי לעולם לא מבטיח תוצאות — מי שכן, מוכר משהו אחר מלבד האמת.`}, ar:{t:`خبراء مال مزيفون`,b:`يبيع بعض "الخبراء" على الإنترنت دورات أو إشارات أو نصائح تدّعي أنها ستجعلك ثرياً بسرعة، غالباً مع عرض لقطات شاشة مزيفة لأرباح. التعليم المالي الحقيقي لا يضمن نتائج أبداً — من يفعل ذلك يبيع شيئاً آخر غير الحقيقة.`}},
   {id:'ponzi', en:{t:`Ponzi Schemes`,b:`A Ponzi scheme pays "returns" to early investors using money from new investors, not real profit — it only works as long as new money keeps coming in, then collapses. If an investment seems to always pay out no matter what happens, that's a warning sign.`}, he:{t:`תרמיות פונזי`,b:`תרמית פונזי משלמת "תשואות" למשקיעים הראשונים בעזרת כסף ממשקיעים חדשים, לא מרווח אמיתי — היא עובדת רק כל עוד כסף חדש ממשיך להיכנס, ואז קורסת. אם השקעה נראית כאילו תמיד משלמת בלי קשר למה שקורה, זה סימן אזהרה.`}, ar:{t:`مخططات بونزي`,b:`يدفع مخطط بونزي "عوائد" للمستثمرين الأوائل باستخدام مال من مستثمرين جدد، وليس ربحاً حقيقياً — يعمل فقط طالما استمر تدفق المال الجديد، ثم ينهار. إذا بدا أن استثماراً ما يدفع دائماً بغض النظر عما يحدث، فهذه علامة تحذير.`}},
   {id:'guaranteed-returns', en:{t:`"Guaranteed Returns"`,b:`No real investment can guarantee a return — every investment carries some risk, even a very small one. The phrase "guaranteed high returns" is one of the clearest signs of a scam in the entire financial world.`}, he:{t:`תשואות "מובטחות"`,b:`אין השקעה אמיתית שיכולה להבטיח תשואה — לכל השקעה יש סיכון כלשהו, גם אם קטן מאוד. הביטוי "תשואות גבוהות מובטחות" הוא אחד הסימנים הברורים ביותר להונאה בכל עולם הפיננסים.`}, ar:{t:`"عوائد مضمونة"`,b:`لا يوجد استثمار حقيقي يمكنه ضمان عائد — كل استثمار ينطوي على قدر من المخاطرة، حتى لو كان صغيراً جداً. عبارة "عوائد عالية مضمونة" هي أحد أوضح علامات الاحتيال في عالم المال بأكمله.`}}
  ]},
  {name:{en:'Digital Threats', he:'איומים דיגיטליים', ar:'التهديدات الرقمية'}, topics:[
   {id:'phishing', en:{t:`Phishing`,b:`Phishing is when someone pretends to be your bank, a company, or even a friend — usually by message or email — to trick you into giving up passwords or personal details. Real banks never ask for your full password or PIN this way.`}, he:{t:`פישינג`,b:`פישינג הוא כשמישהו מתחזה לבנק שלכם, לחברה, או אפילו לחבר — לרוב בהודעה או במייל — כדי לגרום לכם לחשוף סיסמאות או פרטים אישיים. בנקים אמיתיים לעולם לא מבקשים את הסיסמה המלאה או הקוד הסודי שלכם בדרך הזו.`}, ar:{t:`التصيّد الاحتيالي (فيشينغ)`,b:`التصيّد الاحتيالي هو أن يتظاهر شخص ما بأنه بنكك أو شركة أو حتى صديق — عادةً عبر رسالة أو بريد إلكتروني — لخداعك للكشف عن كلمات المرور أو التفاصيل الشخصية. البنوك الحقيقية لا تطلب أبداً كلمة مرورك الكاملة أو رمزك السري بهذه الطريقة.`}},
   {id:'fake-websites', en:{t:`Fake Websites`,b:`Scammers build websites that look almost identical to real banks or investment platforms to steal your login details or payments. Always check the exact web address carefully, and access financial sites by typing them directly rather than clicking a link.`}, he:{t:`אתרים מזויפים`,b:`נוכלים בונים אתרים שנראים כמעט זהים לבנקים או פלטפורמות השקעה אמיתיים כדי לגנוב פרטי התחברות או תשלומים. תמיד כדאי לבדוק את כתובת האתר המדויקת בקפידה, ולגשת לאתרים פיננסיים על ידי הקלדה ישירה ולא לחיצה על קישור.`}, ar:{t:`مواقع إلكترونية مزيفة`,b:`يبني المحتالون مواقع إلكترونية تبدو مطابقة تقريباً لبنوك أو منصات استثمار حقيقية لسرقة بيانات تسجيل الدخول أو المدفوعات. تحقق دائماً من عنوان الموقع بدقة، وادخل إلى المواقع المالية بكتابة العنوان مباشرة بدلاً من النقر على رابط.`}},
   {id:'whatsapp-groups', en:{t:`Suspicious WhatsApp/Telegram Investment Groups`,b:`Groups promising insider stock tips, "sure" crypto gains, or exclusive access to a trading strategy are a common and growing scam format in Israel. Legitimate investment advice doesn't come from strangers in a group chat.`}, he:{t:`קבוצות השקעה חשודות בוואטסאפ/טלגרם`,b:`קבוצות שמבטיחות טיפים "פנימיים" למניות, רווחי קריפטו "בטוחים", או גישה בלעדית לאסטרטגיית מסחר הן פורמט הונאה נפוץ וגדל בישראל. ייעוץ השקעות לגיטימי לא מגיע מזרים בצ'אט קבוצתי.`}, ar:{t:`مجموعات استثمار مشبوهة على واتساب/تيليغرام`,b:`المجموعات التي تعِد بنصائح "داخلية" للأسهم، أو أرباح عملات رقمية "مؤكدة"، أو وصول حصري لاستراتيجية تداول هي نمط احتيال شائع ومتزايد في إسرائيل. النصيحة الاستثمارية الشرعية لا تأتي من غرباء في محادثة جماعية.`}}
  ]},
  {name:{en:'Protecting Yourself', he:'להגן על עצמכם', ar:'حماية نفسك'}, topics:[
   {id:'bank-scams', en:{t:`Bank Scams`,b:`A common scam involves someone calling and claiming to be from your bank's "security department," urgently asking you to move money or share a code to "protect" your account. Real banks never ask you to transfer money to a "safe account" over the phone.`}, he:{t:`הונאות בנק`,b:`הונאה נפוצה כוללת מישהו שמתקשר וטוען שהוא מ"מחלקת האבטחה" של הבנק שלכם, ומבקש בדחיפות שתעבירו כסף או תשתפו קוד כדי "להגן" על החשבון. בנקים אמיתיים לעולם לא מבקשים להעביר כסף ל"חשבון בטוח" בטלפון.`}, ar:{t:`احتيالات بنكية`,b:`يتضمن احتيال شائع اتصال شخص يدّعي أنه من "قسم الأمان" في بنكك، ويطلب منك بإلحاح تحويل المال أو مشاركة رمز "لحماية" حسابك. البنوك الحقيقية لا تطلب أبداً تحويل المال إلى "حساب آمن" عبر الهاتف.`}},
   {id:'verify-service', en:{t:`How to Verify a Financial Service`,b:`Before trusting any investment platform or advisor, check if it's licensed by the Israel Securities Authority, search its name plus the word "scam," and ask a trusted adult. A legitimate service will never pressure you to skip this step.`}, he:{t:`איך לאמת שירות פיננסי`,b:`לפני שסומכים על פלטפורמת השקעות או יועץ, כדאי לבדוק אם יש להם רישיון מרשות ניירות ערך, לחפש את השם שלהם ביחד עם המילה "הונאה", ולשאול מבוגר שסומכים עליו. שירות לגיטימי לעולם לא ילחץ עליכם לדלג על השלב הזה.`}, ar:{t:`كيف تتحقق من مصداقية خدمة مالية`,b:`قبل الوثوق بأي منصة استثمار أو مستشار، تحقق مما إذا كانت مرخصة من هيئة الأوراق المالية الإسرائيلية، وابحث عن اسمها مع كلمة "احتيال"، واسأل شخصاً بالغاً تثق به. الخدمة الشرعية لن تضغط عليك أبداً لتخطي هذه الخطوة.`}},
   {id:'protect-bank-info', en:{t:`Protecting Your Bank Information`,b:`Never share your PIN, full card number, online banking password, or one-time codes with anyone — including someone claiming to be from your bank. Legitimate banks already have your information; they'll never need to ask you for it.`}, he:{t:`הגנה על פרטי הבנק שלכם`,b:`לעולם אל תשתפו את הקוד הסודי, מספר הכרטיס המלא, סיסמת הבנקאות המקוונת, או קודים חד-פעמיים עם אף אחד — כולל מישהו שטוען שהוא מהבנק שלכם. לבנקים אמיתיים כבר יש את המידע שלכם; הם לעולם לא יצטרכו לבקש אותו מכם.`}, ar:{t:`حماية معلوماتك البنكية`,b:`لا تشارك أبداً رمزك السري، أو رقم بطاقتك الكامل، أو كلمة مرور الخدمات المصرفية عبر الإنترنت، أو الرموز لمرة واحدة مع أي شخص — بما في ذلك من يدّعي أنه من بنكك. البنوك الحقيقية لديها معلوماتك بالفعل؛ لن تحتاج أبداً لطلبها منك.`}}
  ]}
 ]}
];

const REALLIFE = [
{id:'real-life', icon:'🇮🇱', color:'#0038B8', name:{en:'Real Life in Israel', he:'חיים אמיתיים בישראל', ar:'الحياة الواقعية في إسرائيل'},
 subs:[
  {name:{en:'Getting Set Up', he:'מתבססים', ar:'الاستقرار'}, topics:[
   {id:'rl-opening-bank-account', en:{t:`Opening Your First Bank Account`,b:`To open a bank account in Israel you'll typically need your ID (teudat zehut), and if you're under 18, a parent or guardian usually needs to come with you or give consent. Compare a few banks first — youth accounts are often fee-free, and the account you open now is probably the one you'll use for years.`}, he:{t:`פתיחת חשבון הבנק הראשון שלכם`,b:`כדי לפתוח חשבון בנק בישראל בדרך כלל צריך תעודת זהות, ואם אתם מתחת לגיל 18, לרוב הורה או אפוטרופוס צריך להגיע איתכם או לתת הסכמה. כדאי להשוות כמה בנקים קודם — חשבונות לבני נוער לרוב ללא עמלות, והחשבון שתפתחו עכשיו כנראה ילווה אתכם שנים.`}, ar:{t:`فتح حسابك البنكي الأول`,b:`لفتح حساب بنكي في إسرائيل تحتاج عادةً إلى بطاقة هويتك، وإذا كنت دون سن 18 فعادةً يجب أن يحضر معك أحد الوالدين أو الوصي أو يقدّم موافقته. قارن بين عدة بنوك أولاً — حسابات الشباب غالباً بدون رسوم، والحساب الذي تفتحه الآن سيرافقك على الأرجح لسنوات.`}},
   {id:'rl-debit-vs-credit', en:{t:`Debit vs. Credit Cards in Israel`,b:`A debit card (kartis chiyuv miyadi) takes money straight from your account, so you can't spend what isn't there. A credit card (kartis ashrai) lets you spend now and pay later — useful for building a credit history, but risky if you spend more than you can repay.`}, he:{t:`כרטיס חיוב מול כרטיס אשראי בישראל`,b:`כרטיס חיוב מיידי מוריד כסף ישירות מהחשבון שלכם, כך שאי אפשר להוציא מה שאין. כרטיס אשראי מאפשר להוציא עכשיו ולשלם מאוחר יותר — שימושי לבניית היסטוריית אשראי, אבל מסוכן אם מוציאים יותר ממה שאפשר להחזיר.`}, ar:{t:`بطاقة الخصم مقابل بطاقة الائتمان في إسرائيل`,b:`بطاقة الخصم الفوري تسحب المال مباشرة من حسابك، لذا لا يمكنك إنفاق ما لا تملكه. بطاقة الائتمان تتيح لك الإنفاق الآن والدفع لاحقاً — مفيدة لبناء تاريخ ائتماني، لكنها خطيرة إذا أنفقت أكثر مما تستطيع سداده.`}},
   {id:'rl-bit-paybox', en:{t:`Bit / PayBox: Israel's Payment Apps`,b:`Bit and PayBox are apps almost everyone in Israel uses to send and receive money instantly, usually linked straight to a bank account. They're handy for splitting a bill or paying back a friend, but only send money to people you actually trust — a payment can't easily be undone.`}, he:{t:`ביט / פייבוקס: אפליקציות התשלום של ישראל`,b:`ביט ופייבוקס הן אפליקציות שכמעט כולם בישראל משתמשים בהן כדי לשלוח ולקבל כסף באופן מיידי, בדרך כלל מקושרות ישירות לחשבון בנק. הן נוחות לפיצול חשבון או להחזרת כסף לחבר, אבל כדאי לשלוח כסף רק למי שבאמת סומכים עליו — קשה לבטל תשלום.`}, ar:{t:`بيت / باي بوكس: تطبيقات الدفع في إسرائيل`,b:`بيت وباي بوكس تطبيقان يستخدمهما تقريباً الجميع في إسرائيل لإرسال واستلام المال فوراً، وعادةً ما يكونان مرتبطين مباشرة بحساب بنكي. مفيدان لتقسيم فاتورة أو إعادة مال لصديق، لكن أرسل المال فقط لمن تثق بهم فعلاً — لا يمكن التراجع عن الدفعة بسهولة.`}},
   {id:'rl-first-job', en:{t:`Starting Your First Job`,b:`Before your first day, you'll usually sign an employment contract and fill out a tax form (Form 101) so your employer can calculate your tax correctly. Keep a copy of everything you sign, and don't hesitate to ask what a form means before signing it.`}, he:{t:`התחלת העבודה הראשונה שלכם`,b:`לפני היום הראשון, בדרך כלל תחתמו על חוזה העסקה ותמלאו טופס 101 כדי שהמעסיק יוכל לחשב את המס שלכם נכון. שמרו עותק מכל מה שאתם חותמים עליו, ואל תהססו לשאול מה משמעות טופס לפני שחותמים עליו.`}, ar:{t:`بدء عملك الأول`,b:`قبل يومك الأول، ستوقع عادةً على عقد عمل وتملأ نموذجاً ضريبياً (טופס 101) حتى يتمكن صاحب العمل من حساب ضريبتك بشكل صحيح. احتفظ بنسخة من كل ما توقعه، ولا تتردد في السؤال عن معنى النموذج قبل التوقيع عليه.`}}
  ]},
  {name:{en:'Housing', he:'דיור', ar:'السكن'}, topics:[
   {id:'rl-renting-apartment', en:{t:`Renting Your First Apartment`,b:`Apartment hunting in Israel usually means working with a real-estate agent (who charges a fee, often one month's rent) or searching directly with landlords. Budget for more than just monthly rent — you'll likely need a security deposit and possibly a guarantor too.`}, he:{t:`השכרת הדירה הראשונה שלכם`,b:`חיפוש דירה בישראל בדרך כלל כרוך בעבודה עם מתווך (שגובה עמלה, לרוב שכר דירה של חודש) או חיפוש ישיר מול בעלי דירות. תקצבו יותר משכר הדירה החודשי בלבד — כנראה תזדקקו לפיקדון ואולי גם לערב.`}, ar:{t:`استئجار شقتك الأولى`,b:`البحث عن شقة في إسرائيل يعني عادةً العمل مع وسيط عقاري (يتقاضى رسوماً، غالباً إيجار شهر واحد) أو البحث مباشرة مع الملاك. ضع ميزانية أكبر من الإيجار الشهري فقط — ستحتاج على الأرجح إلى وديعة تأمين وربما ضامن أيضاً.`}},
   {id:'rl-rental-contract', en:{t:`Understanding a Rental Contract`,b:`An Israeli rental contract (chozeh schirut) typically lists the rent, deposit, and contract length, and often requires a guarantor (arev) who agrees to cover the rent if you can't. Read every clause before signing — especially what happens to your deposit when you move out.`}, he:{t:`הבנת חוזה שכירות`,b:`חוזה שכירות ישראלי בדרך כלל כולל את שכר הדירה, הפיקדון, אורך החוזה, ולעיתים קרובות דורש ערב שמסכים לכסות את שכר הדירה אם לא תוכלו. קראו כל סעיף לפני החתימה — במיוחד מה קורה לפיקדון שלכם כשאתם עוזבים.`}, ar:{t:`فهم عقد الإيجار`,b:`عقد الإيجار الإسرائيلي يتضمن عادةً الإيجار والوديعة ومدة العقد، وغالباً ما يتطلب ضامناً يوافق على تغطية الإيجار إذا لم تستطع. اقرأ كل بند قبل التوقيع — خاصة ما يحدث لوديعتك عند انتقالك.`}},
   {id:'rl-arnona', en:{t:`What Is Arnona?`,b:`Arnona is a municipal property tax paid by whoever lives in a home — owner or renter — based on the apartment's size and city. It's usually billed separately from rent, so factor it into your real monthly housing cost.`}, he:{t:`מהי ארנונה?`,b:`ארנונה היא מס עירוני שמשולם על ידי מי שגר בדירה — בעלים או שוכר — לפי גודל הדירה והעיר. היא בדרך כלל מחויבת בנפרד משכר הדירה, אז כדאי לכלול אותה בעלות הדיור החודשית האמיתית שלכם.`}, ar:{t:`ما هي الأرنونا؟`,b:`الأرنونا هي ضريبة عقارية بلدية يدفعها من يسكن في الشقة — سواء المالك أو المستأجر — بناءً على حجم الشقة والمدينة. عادةً ما تُفوتَر بشكل منفصل عن الإيجار، لذا احسبها ضمن تكلفة سكنك الشهرية الحقيقية.`}},
   {id:'rl-roommates', en:{t:`Splitting Costs with Roommates`,b:`When sharing an apartment, agree in advance exactly how rent, arnona, and bills will be split — equally, or by room size — and put it in writing. A shared payment app like Bit makes splitting monthly costs much easier to track.`}, he:{t:`פיצול הוצאות עם שותפים לדירה`,b:`כששותפים דירה, כדאי לסכם מראש בדיוק איך שכר הדירה, הארנונה והחשבונות יתחלקו — שווה בשווה, או לפי גודל החדר — ולהעלות את זה על הכתב. אפליקציית תשלומים משותפת כמו ביט הופכת את המעקב אחר פיצול ההוצאות החודשיות לקל בהרבה.`}, ar:{t:`تقسيم التكاليف مع زملاء السكن`,b:`عند مشاركة شقة، اتفق مسبقاً بالضبط على كيفية تقسيم الإيجار والأرنونا والفواتير — بالتساوي، أو حسب حجم الغرفة — ودوّن ذلك كتابياً. تطبيق دفع مشترك مثل بيت يجعل تتبع تقسيم التكاليف الشهرية أسهل بكثير.`}}
  ]},
  {name:{en:'Big Purchases', he:'רכישות גדולות', ar:'المشتريات الكبيرة'}, topics:[

   {id:'rl-university-costs', en:{t:`University & Higher Education Costs`,b:`Tuition at Israeli universities is regulated and similar across public institutions, but housing, books, and living costs often add up to more than the tuition itself. Look into scholarships, student loans, and part-time work early — planning ahead makes a big difference.`}, he:{t:`עלויות אוניברסיטה והשכלה גבוהה`,b:`שכר הלימוד באוניברסיטאות בישראל מוסדר ודומה בין המוסדות הציבוריים, אך דיור, ספרים והוצאות מחיה לרוב מצטברים ליותר משכר הלימוד עצמו. כדאי לבדוק מלגות, הלוואות סטודנטים ועבודה חלקית מוקדם — תכנון מראש עושה הבדל גדול.`}, ar:{t:`تكاليف الجامعة والتعليم العالي`,b:`الرسوم الدراسية في الجامعات الإسرائيلية منظمة ومتشابهة بين المؤسسات العامة، لكن السكن والكتب ومصاريف المعيشة غالباً ما تتراكم لتفوق الرسوم نفسها. ابحث عن المنح الدراسية وقروض الطلاب والعمل بدوام جزئي مبكراً — التخطيط المسبق يُحدث فرقاً كبيراً.`}},

   {id:'rl-investing-broker', en:{t:`Investing Through an Israeli Broker`,b:`To actually buy stocks or ETFs, you open an account with a brokerage or trading platform, transfer money in, and place orders — much like online shopping, but for investments. Compare trading fees and account fees between brokers first, since they can eat into your returns over time.`}, he:{t:`השקעה דרך ברוקר ישראלי`,b:`כדי לקנות בפועל מניות או קרנות סל, פותחים חשבון בבית השקעות או פלטפורמת מסחר, מעבירים כסף, ומבצעים הזמנות — די דומה לקנייה מקוונת, אבל עבור השקעות. כדאי להשוות עמלות מסחר ועמלות חשבון בין ברוקרים קודם, כי הן יכולות לכרסם בתשואות שלכם עם הזמן.`}, ar:{t:`الاستثمار عبر وسيط إسرائيلي`,b:`لشراء الأسهم أو صناديق ETF فعلياً، تفتح حساباً لدى شركة استثمار أو منصة تداول، وتحوّل مالاً إليه، وتضع أوامر شراء — يشبه إلى حد ما التسوق عبر الإنترنت، لكن للاستثمارات. قارن رسوم التداول ورسوم الحساب بين الوسطاء أولاً، لأنها يمكن أن تقتطع من عوائدك مع الوقت.`}},

function allTopicIdsCombined(){
  let ids=[];
  allCategoriesCombined().forEach(c=>c.subs.forEach(s=>s.topics.forEach(tp=>ids.push(tp.id))));
  return ids;
}
function totalTopicsCombined(){ return allTopicIdsCombined().length; }
function doneCountCombined(){ return allTopicIdsCombined().filter(id=>state.progress[id]).length; }

function findCategory(catId){ return DATA.find(c=>c.id===catId) || REALLIFE.find(c=>c.id===catId); }

// ===== XP / Levels / Badges =====
function addXP(n){ state.xp += n; }

function getLevelIndex(xp){
  let idx = 0;
  for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].xp) idx=i; }
  return idx;
}
function getLevelProgress(){
  const idx = getLevelIndex(state.xp);
  const cur = LEVELS[idx];
  const next = LEVELS[idx+1];
  if(!next) return {idx, cur, next:null, pct:100, xpToNext:0};
  const span = next.xp - cur.xp;
  const into = state.xp - cur.xp;
  return {idx, cur, next, pct: Math.min(100, Math.round((into/span)*100)), xpToNext: next.xp-state.xp};
}

function showToast(text, emoji){
  const el = document.createElement('div');
  el.className='xp-toast';
  el.innerHTML = `<span style="font-size:18px;">${emoji||'🏅'}</span><span>${text}</span>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, 2800);
}

function allBadgeDefs(){
  const cats = allCategoriesCombined().map(cat=>({
    id:'cat-'+cat.id, icon:cat.icon,
    name: t('catBadgeName',{cat: cat.name[state.lang]}),
    desc: t('catBadgeDesc',{cat: cat.name[state.lang]}),
    earned: catTopicIds(cat).every(id=>state.progress[id])
  }));
  const milestones = MILESTONE_BADGES.map(b=>({
    id:b.id, icon:b.icon,
    name: t('badge'+capitalize(b.id)+'Name'),
    desc: t('badge'+capitalize(b.id)+'Desc'),
    earned: !!state.badges[b.id]
  }));
  return milestones.concat(cats);
}
function capitalize(id){
  return id.split('-').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join('');
}

function checkBadges(){
  const newly = [];
  const doneAll = doneCountCombined(), totalAll = totalTopicsCombined();
  if(doneAll>=1 && !state.badges['first-steps']) newly.push('first-steps');
  if(state.hadPerfectQuiz && !state.badges['quiz-whiz']) newly.push('quiz-whiz');
  if(state.bestStreak>=5 && !state.badges['streak-5']) newly.push('streak-5');
  if(totalAll>0 && doneAll>=Math.ceil(totalAll/2) && !state.badges['halfway']) newly.push('halfway');
  if(totalAll>0 && doneAll===totalAll && !state.badges['money-master']) newly.push('money-master');
  allCategoriesCombined().forEach(cat=>{
    const id = 'cat-'+cat.id;
    if(catTopicIds(cat).length>0 && catDoneCount(cat)===catTopicIds(cat).length && !state.badges[id]) newly.push(id);
  });
  newly.forEach(id=>{
    state.badges[id] = true;
    const isCat = id.startsWith('cat-');
    let name;
    if(isCat){
      const cat = findCategory(id.replace('cat-',''));
      name = t('catBadgeName',{cat: cat.name[state.lang]});
    } else {
      name = t('badge'+capitalize(id)+'Name');
    }
    showToast(t('badgeEarnedToast',{name}), '🏅');
  });
}

function setLang(code){
  state.lang = code; state.langMenuOpen = false;
  document.documentElement.setAttribute('lang', code);
  document.documentElement.setAttribute('dir', dirFor(code));

function goto(screen, extra){
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo(0,0);

  // Deferred here (rather than firing at the moment they tapped the category) so they
  // actually get to browse the category before being sent back.
  if(screen === 'home') checkGoalComplete();
}

// ===== Local persistence (per-profile, by name) =====
const PROFILES_KEY = 'israfin:profiles';
const LAST_USER_KEY = 'israfin:lastUser';
const PROFILE_FIELDS = ['userName','avatar','lang','xp','progress','badges','bestStreak','answerStreak','hadPerfectQuiz','goal','goalGlow','goalVisited','realLifeMode'];

function storageAvailable(){
  try{
    const k = '__israfin_test__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function profileKeyFor(name){ return (name||'').trim().toLowerCase(); }
function loadProfiles(){
  if(!storageAvailable()) return {};
  try{
    const raw = window.localStorage.getItem(PROFILES_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProfiles(profiles){
  if(!storageAvailable()) return;
  try{ window.localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }catch(e){}
}
function saveCurrentProfile(){
  if(!state._profileLoaded) return; // never persist until we've genuinely loaded or intentionally started this profile
  if(!state.userName || state.userName.trim()==='') return;
  const profiles = loadProfiles();
  const key = profileKeyFor(state.userName);
  const snapshot = {};
  PROFILE_FIELDS.forEach(f => { snapshot[f] = state[f]; });
  snapshot.savedAt = Date.now();
  profiles[key] = snapshot;
  saveProfiles(profiles);
  try{ window.localStorage.setItem(LAST_USER_KEY, state.userName); }catch(e){}
}
function loadProfileInto(name){
  const profiles = loadProfiles();
  const saved = profiles[profileKeyFor(name)];
  if(!saved) return false;
  PROFILE_FIELDS.forEach(f => { if(saved[f]!==undefined) state[f] = saved[f]; });
  state.userName = name; // preserve exact casing the user typed this time
  return true;
}
function getLastUser(){
  if(!storageAvailable()) return '';
  try{ return window.localStorage.getItem(LAST_USER_KEY) || ''; }catch(e){ return ''; }
}

function logoutUser(){
  saveCurrentProfile(); // preserve this user's progress before switching
  state.userName = '';
  state.avatar = '🦉';
  state.screen = 'login';
  state.activeCategory = null;
  state.activeTopic = null;
  state.progress = {};
  state.quiz = null;
  state.xp = 0;
  state.answerStreak = 0;
  state.bestStreak = 0;
  state.hadPerfectQuiz = false;
  state.badges = {};
  state.sim = null;
  state.realLifeMode = false;
  state.goal = null;
  state.goalGlow = {};
  state.goalVisited = {};
  state.goalJustFinished = false;
  state._profileLoaded = false;
  render();
  window.scrollTo(0,0);
}

  cats.forEach(id => { state.goalGlow[id] = true; });
  goto('home');
}

function checkGoalComplete(){
  if(!state.goal) return;
  const cats = GOAL_MAP[state.goal] || [];
  const allVisited = cats.every(id => state.goalVisited[id]);
  if(allVisited){
    state.goal = null;
    state.goalGlow = {};
    state.goalVisited = {};
    state.goalJustFinished = true;
    goto('goals');
  }
}

      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 26 26)"/>
  </svg>`;
}

  cat.subs.forEach((s,sIdx)=>s.topics.forEach((tp,tIdx)=>flat.push({sIdx,tIdx,topic:tp})));

}

// ===== Quiz logic =====
const LETTERS = ['A','B','C','D'];

function startQuiz(kind, catId, subIdx, topicIdx){
  const cat = findCategory(catId);
  let questions;
  if(kind==='topic'){
    const tp = cat.subs[subIdx].topics[topicIdx];
    questions = QUIZDATA.topics[tp.id][state.lang];
  } else {
    questions = QUIZDATA.subs[catId+':'+subIdx][state.lang];
  }
  state.quiz = { kind, catId, subIdx, topicIdx, questions, qIndex:0, answers: new Array(questions.length).fill(null), submitted:false };
  goto('quiz');
}

function selectQuizAnswer(optIdx){
  state.quiz.answers[state.quiz.qIndex] = optIdx;
  render();
}

function quizNext(){
  if(state.quiz.qIndex < state.quiz.questions.length-1){ state.quiz.qIndex++; render(); }
}
function quizPrev(){
  if(state.quiz.qIndex > 0){ state.quiz.qIndex--; render(); }
}
function quizSubmit(){
  const score = quizScore();
  const total = state.quiz.questions.length;
  let xpGain = score*2;
  const isPerfect = score===total && total>0;
  if(isPerfect){ xpGain += 15; state.hadPerfectQuiz = true; }
  state.quiz.questions.forEach((q,i)=>{
    if(state.quiz.answers[i]===q.c){ state.answerStreak++; state.bestStreak = Math.max(state.bestStreak, state.answerStreak); }
    else state.answerStreak = 0;
  });
  addXP(xpGain);
  state.quiz.xpGained = xpGain;
  state.quiz.submitted = true;
  checkBadges();
  render();
  window.scrollTo(0,0);
}
function quizScore(){
  let score = 0;
  state.quiz.questions.forEach((q,i)=>{ if(state.quiz.answers[i]===q.c) score++; });
  return score;
}

// ===== Compound interest calculator =====
function computeCompound(start, monthly, ratePct, years){
  const monthlyRate = ratePct/100/12;
  let balance = start;
  const compoundSeries = [Math.round(start)];
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){ balance = balance*(1+monthlyRate) + monthly; }
    compoundSeries.push(Math.round(balance));
  }
  const plainSeries = [];
  for(let y=0;y<=years;y++){ plainSeries.push(Math.round(start + monthly*12*y)); }
  return { compoundSeries, plainSeries, compoundTotal: compoundSeries[compoundSeries.length-1], plainTotal: plainSeries[plainSeries.length-1] };
}

function buildGrowthChart(plainSeries, compoundSeries){
  const w=280, h=150, pad=8;
  const maxVal = Math.max(...compoundSeries, 1);
  const n = compoundSeries.length;
  const xStep = (w-pad*2)/(n-1||1);
  const toPoint = (val,i)=>{
    const x = pad + i*xStep;
    const y = h - pad - (val/maxVal)*(h-pad*2);
    return `${x},${y}`;
  };
  const compoundPts = compoundSeries.map((v,i)=>toPoint(v,i)).join(' ');
  const plainPts = plainSeries.map((v,i)=>toPoint(v,i)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="150">
    <polyline points="${plainPts}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="4,4"/>
    <polyline points="${compoundPts}" fill="none" stroke="var(--emerald)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ===== Paycheck breakdown calculator =====
function computePaycheck(gross){
  const brackets = [
    {upTo:7010, rate:0.10}, {upTo:10060, rate:0.14}, {upTo:16150, rate:0.20},
    {upTo:22440, rate:0.31}, {upTo:46690, rate:0.35}, {upTo:60130, rate:0.47}, {upTo:Infinity, rate:0.50}
  ];
  let tax=0, prev=0;
  for(const b of brackets){
    if(gross>prev){ tax += (Math.min(gross,b.upTo)-prev)*b.rate; prev=b.upTo; } else break;
  }
  const creditValue = 242*2.25;
  const taxAfterCredits = Math.max(0, tax-creditValue);
  const niThreshold=7522;
  const ni = Math.min(gross,niThreshold)*0.004 + Math.max(0,gross-niThreshold)*0.07;
  const pension = gross*0.06;
  const net = Math.max(0, gross - taxAfterCredits - ni - pension);
  return { tax: Math.round(taxAfterCredits), ni: Math.round(ni), pension: Math.round(pension), net: Math.round(net) };
}

function renderCalcPaycheck(){
  const gross = state.calc.gross;

  const segs = [

// ===== Budget simulator (mini-game) =====
function startSimulator(){
  state.sim = { round:0, savings:0, invested:0, debtTotal:0, phase:'choice', lastOutcome:null };
  goto('simulator');
}

function chooseSimAction(action){
  const r = SIM_ROUNDS[state.sim.round];
  const outcome = { action, pay:r.pay, eventType: r.event?r.event.type:null };
  if(action==='save') state.sim.savings += r.pay;
  else if(action==='invest') state.sim.invested += r.pay;
  // spend: money is gone, no bucket change

  if(r.event){
    if(r.event.type==='expense'){
      outcome.labelKey = r.event.labelKey; outcome.amt = r.event.amt;
      if(state.sim.savings >= r.event.amt){
        state.sim.savings -= r.event.amt;
        outcome.eventResult = 'paidSavings';
      } else {
        const shortfall = r.event.amt - state.sim.savings;
        state.sim.savings = 0;
        state.sim.debtTotal += shortfall;
        outcome.eventResult = 'debt';
        outcome.shortfall = shortfall;
      }
    } else if(r.event.type==='bonus'){
      state.sim.savings += r.event.amt;
      outcome.amt = r.event.amt;
      outcome.eventResult = 'bonus';
    } else if(r.event.type==='market'){
      if(state.sim.invested > 0){
        const swing = (Math.random()*0.20 - 0.05); // -5% to +15%
        const before = state.sim.invested;
        state.sim.invested = Math.round(state.sim.invested * (1+swing));
        outcome.eventResult = swing>=0 ? 'marketUp' : 'marketDown';
        outcome.pct = Math.abs(Math.round(swing*100));
      } else {
        outcome.eventResult = 'marketNone';
      }
    }
  }
  state.sim.lastOutcome = outcome;
  state.sim.phase = 'result';
  render();
  window.scrollTo(0,0);
}

function continueSim(){
  if(state.sim.round < SIM_ROUNDS.length-1){
    state.sim.round++;
    state.sim.phase = 'choice';
  } else {
    state.sim.phase = 'summary';
    state.sim.xpGained = 20;
    addXP(20);
    checkBadges();
  }
  render();
  window.scrollTo(0,0);
}

function buildSimOutcomeLines(){
  const o = state.sim.lastOutcome;
  const lines = [];
  if(o.action==='save') lines.push(t('simActionSave',{pay:o.pay}));
  else if(o.action==='spend') lines.push(t('simActionSpend',{pay:o.pay}));
  else if(o.action==='invest') lines.push(t('simActionInvest',{pay:o.pay}));

  if(o.eventType==='expense'){
    const label = t(o.labelKey);
    if(o.eventResult==='paidSavings') lines.push(t('simExpensePaidSavings',{label, amt:o.amt}));
    else lines.push(t('simExpenseDebt',{label, amt:o.amt, shortfall:o.shortfall}));
  } else if(o.eventType==='bonus'){
    lines.push(t('simBonus',{amt:o.amt}));
  } else if(o.eventType==='market'){
    if(o.eventResult==='marketUp') lines.push(t('simMarketUp',{pct:o.pct}));
    else if(o.eventResult==='marketDown') lines.push(t('simMarketDown',{pct:o.pct}));
    else lines.push(t('simMarketNone'));
  }
  return lines;
}
