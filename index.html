// ===== Master render =====
function render(){
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('dir', dirFor(state.lang));
  let html = '';
  if(state.screen==='login') html = renderLogin();
  else if(state.screen==='goals') html = renderGoals();
  else if(state.screen==='home') html = renderHome();
  else if(state.screen==='category') html = renderCategory();
  else if(state.screen==='lesson') html = renderLesson();
  else if(state.screen==='quiz') html = renderQuiz();
  else if(state.screen==='profile') html = renderProfile();
  else if(state.screen==='calc-compound') html = renderCalcCompound();
  else if(state.screen==='calc-paycheck') html = renderCalcPaycheck();
  else if(state.screen==='simulator') html = renderSimulator();
  document.getElementById('app').innerHTML = html + renderConfirmModal();
  attachEvents();
  saveCurrentProfile();
}

function attachEvents(){
  const confirmModalOk = document.getElementById('confirmModalOk');
  if(confirmModalOk){
    confirmModalOk.addEventListener('click', ()=>{
      const action = state.confirmModal && state.confirmModal.action;
      state.confirmModal = null;
      if(action) action();
      else render();
    });
  }
  const confirmModalCancel = document.getElementById('confirmModalCancel');
  if(confirmModalCancel) confirmModalCancel.addEventListener('click', hideConfirm);
  const confirmModalOverlay = document.getElementById('confirmModalOverlay');
  if(confirmModalOverlay){
    confirmModalOverlay.addEventListener('click', (e)=>{ if(e.target===confirmModalOverlay) hideConfirm(); });
  }

  const langToggle = document.getElementById('langToggle');
  if(langToggle){
    langToggle.addEventListener('click', (e)=>{ e.stopPropagation(); state.langMenuOpen = !state.langMenuOpen; render(); });
  }
  const switchUserBtn = document.getElementById('switchUserBtn');
  if(switchUserBtn){
    switchUserBtn.addEventListener('click', ()=>{
      showConfirm(t('logoutConfirm'), logoutUser);
    });
  }
  const langMenu = document.getElementById('langMenu');
  if(langMenu){
    langMenu.querySelectorAll('.lang-opt').forEach(el=>{
      el.addEventListener('click', ()=> setLang(el.dataset.lang));
    });
  }
  document.querySelectorAll('.mini-lang').forEach(el=>{
    el.addEventListener('click', ()=> setLang(el.dataset.lang));
  });
  document.addEventListener('click', (e)=>{
    if(state.langMenuOpen && !e.target.closest('.topbar-actions')){ state.langMenuOpen=false; render(); }
  }, {once:true});

  // Login screen
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.addEventListener('input', (e)=>{
      state.userName = e.target.value;
      const btn = document.getElementById('startBtn');
      if(btn) btn.disabled = state.userName.trim()==='';
    });
  }
  document.querySelectorAll('.avatar-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ state.avatar = el.dataset.avatar; render(); });
  });
  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      if(state.userName.trim()==='') return;
      const hadProfile = loadProfileInto(state.userName);
      state._profileLoaded = true;
      goto(hadProfile ? 'home' : 'goals');
    });
  }

  // Goal picker
  document.querySelectorAll('.goal-card').forEach(el=>{
    el.addEventListener('click', ()=> selectGoal(el.dataset.goal));
  });

  // Home screen
  document.querySelectorAll('.cat-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const catId = el.dataset.cat;
      if(state.goalGlow[catId]) state.goalVisited[catId] = true;
      goto('category', {activeCategory: catId});
      // completion check runs when user returns to home, so they can browse the category first
    });
  });
  const realLifeCard = document.querySelector('.reallife-featured-card');
  if(realLifeCard) realLifeCard.addEventListener('click', ()=>{
    // Unlike other goals, Real Life only counts as "visited" once every Real Life
    // lesson is finished (checked separately when a lesson is completed) — not
    // just from tapping in.
    goto('category', {activeCategory: realLifeCard.dataset.cat});
  });
  const realLifeToggle = document.getElementById('realLifeToggle');
  if(realLifeToggle) realLifeToggle.addEventListener('click', ()=>{
    state.realLifeMode = !state.realLifeMode;
    // Flipping the toggle just changes the display mode — it should NOT count as
    // "visiting" the Real Life goal. Visited is only set when the user actually
    // taps into the Real Life lessons via the featured card below.
    render();
  });
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.addEventListener('click', ()=> goto('profile'));
  const openProfileChip = document.getElementById('openProfileChip');
  if(openProfileChip) openProfileChip.addEventListener('click', ()=> goto('profile'));
  document.querySelectorAll('.tool-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kind = el.dataset.tool;
      if(kind==='compound') goto('calc-compound');
      else if(kind==='paycheck') goto('calc-paycheck');
      else if(kind==='sim') startSimulator();
    });
  });

  // Category screen
  const backHome = document.getElementById('backHome');
  if(backHome) backHome.addEventListener('click', ()=> goto('home'));
  document.querySelectorAll('.topic-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      goto('lesson', {activeTopic: {catId: state.activeCategory, subIdx: parseInt(el.dataset.sub), topicIdx: parseInt(el.dataset.topic)}});
    });
  });
  document.querySelectorAll('.subsection-quiz-btn').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      startQuiz('sub', state.activeCategory, parseInt(el.dataset.subQuiz), null);
    });
  });

  // Lesson screen
  const backCat = document.getElementById('backCat');
  if(backCat) backCat.addEventListener('click', ()=> goto('category', {activeCategory: state.activeTopic.catId}));
  const startTopicQuizBtn = document.getElementById('startTopicQuizBtn');
  if(startTopicQuizBtn){
    startTopicQuizBtn.addEventListener('click', ()=>{
      startQuiz('topic', state.activeTopic.catId, state.activeTopic.subIdx, state.activeTopic.topicIdx);
    });
  }
  const retakeQuizBtn = document.getElementById('retakeQuizBtn');
  if(retakeQuizBtn){
    retakeQuizBtn.addEventListener('click', ()=>{
      startQuiz('topic', state.activeTopic.catId, state.activeTopic.subIdx, state.activeTopic.topicIdx);
    });
  }
  const prevBtn = document.getElementById('prevTopic');
  if(prevBtn){
    prevBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.activeTopic.catId);
      const flat = flatTopicList(cat);
      const curIdx = flat.findIndex(f=>f.sIdx===state.activeTopic.subIdx && f.tIdx===state.activeTopic.topicIdx);
      if(curIdx>0){ const p = flat[curIdx-1]; goto('lesson', {activeTopic:{catId:cat.id, subIdx:p.sIdx, topicIdx:p.tIdx}}); }
    });
  }
  const nextBtn = document.getElementById('nextTopic');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.activeTopic.catId);
      const flat = flatTopicList(cat);
      const curIdx = flat.findIndex(f=>f.sIdx===state.activeTopic.subIdx && f.tIdx===state.activeTopic.topicIdx);
      if(curIdx<flat.length-1){ const n = flat[curIdx+1]; goto('lesson', {activeTopic:{catId:cat.id, subIdx:n.sIdx, topicIdx:n.tIdx}}); }
    });
  }

  // Quiz screen
  const backFromQuiz = document.getElementById('backFromQuiz');
  if(backFromQuiz){
    backFromQuiz.addEventListener('click', ()=>{
      showConfirm(t('quizExitConfirm'), exitQuizToOrigin);
    });
  }
  document.querySelectorAll('.quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=> selectQuizAnswer(parseInt(el.dataset.opt)));
  });
  const quizPrevBtn = document.getElementById('quizPrevBtn');
  if(quizPrevBtn) quizPrevBtn.addEventListener('click', quizPrev);
  const quizNextBtn = document.getElementById('quizNextBtn');
  if(quizNextBtn){
    quizNextBtn.addEventListener('click', ()=>{
      const isLast = state.quiz.qIndex === state.quiz.questions.length-1;
      if(isLast) quizSubmit(); else quizNext();
    });
  }
  const quizMarkCompleteBtn = document.getElementById('quizMarkCompleteBtn');
  if(quizMarkCompleteBtn){
    quizMarkCompleteBtn.addEventListener('click', ()=>{
      const cat = findCategory(state.quiz.catId);
      const tp = cat.subs[state.quiz.subIdx].topics[state.quiz.topicIdx];
      const wasAlreadyDone = !!state.progress[tp.id];
      state.progress[tp.id] = true;
      if(!wasAlreadyDone){ addXP(10); checkBadges(); showToast(t('xpGainedToast',{xp:10}), '✨'); }
      // Real Life goal only counts as "visited" once every Real Life lesson is done.
      if(state.goalGlow['real-life'] && state.quiz.catId === 'real-life'){
        const rlCat = REALLIFE[0];
        if(catTopicIds(rlCat).every(id => state.progress[id])) state.goalVisited['real-life'] = true;
      }
      goto('lesson', {activeTopic:{catId: state.quiz.catId, subIdx: state.quiz.subIdx, topicIdx: state.quiz.topicIdx}});
    });
  }
  const quizRetakeBtn = document.getElementById('quizRetakeBtn');
  if(quizRetakeBtn){
    quizRetakeBtn.addEventListener('click', ()=>{
      startQuiz(state.quiz.kind, state.quiz.catId, state.quiz.subIdx, state.quiz.topicIdx);
    });
  }
  const quizBackBtn = document.getElementById('quizBackBtn');
  if(quizBackBtn){
    quizBackBtn.addEventListener('click', exitQuizToOrigin);
  }

  // Profile screen
  const backHomeFromProfile = document.getElementById('backHomeFromProfile');
  if(backHomeFromProfile) backHomeFromProfile.addEventListener('click', ()=> goto('home'));

  // Calculator screens
  const backHomeFromCalc = document.getElementById('backHomeFromCalc');
  if(backHomeFromCalc) backHomeFromCalc.addEventListener('click', ()=> goto('home'));
  const calcStart = document.getElementById('calcStart');
  if(calcStart) calcStart.addEventListener('input', (e)=>{ state.calc.start = parseInt(e.target.value); render(); });
  const calcMonthly = document.getElementById('calcMonthly');
  if(calcMonthly) calcMonthly.addEventListener('input', (e)=>{ state.calc.monthly = parseInt(e.target.value); render(); });
  const calcRate = document.getElementById('calcRate');
  if(calcRate) calcRate.addEventListener('input', (e)=>{ state.calc.rate = parseFloat(e.target.value); render(); });
  const calcYears = document.getElementById('calcYears');
  if(calcYears) calcYears.addEventListener('input', (e)=>{ state.calc.years = parseInt(e.target.value); render(); });
  const calcGross = document.getElementById('calcGross');
  if(calcGross) calcGross.addEventListener('input', (e)=>{ state.calc.gross = parseInt(e.target.value); render(); });

  // Simulator screen
  const backHomeFromSim = document.getElementById('backHomeFromSim');
  if(backHomeFromSim) backHomeFromSim.addEventListener('click', ()=> goto('home'));
  document.querySelectorAll('.sim-action-btn').forEach(el=>{
    el.addEventListener('click', ()=> chooseSimAction(el.dataset.simAction));
  });
  const simContinueBtn = document.getElementById('simContinueBtn');
  if(simContinueBtn) simContinueBtn.addEventListener('click', continueSim);
  const simPlayAgainBtn = document.getElementById('simPlayAgainBtn');
  if(simPlayAgainBtn) simPlayAgainBtn.addEventListener('click', startSimulator);
  const simBackToolsBtn = document.getElementById('simBackToolsBtn');
  if(simBackToolsBtn) simBackToolsBtn.addEventListener('click', ()=> goto('home'));
}

function exitQuizToOrigin(){
  if(state.quiz.kind==='topic'){
    goto('lesson', {activeTopic:{catId: state.quiz.catId, subIdx: state.quiz.subIdx, topicIdx: state.quiz.topicIdx}});
  } else {
    goto('category', {activeCategory: state.quiz.catId});
  }
}

// Prefill the last-used name on a genuine fresh page load only (not after an in-session logout).
const __lastUser = getLastUser();
if(__lastUser) state.userName = __lastUser;

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Registration can fail if not served over https/localhost, or files aren't hosted alongside this one — app still works without it.
    });
  });
}
</script>
</body>
</html>
