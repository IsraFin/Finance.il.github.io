<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IsraFin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4A38">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IsraFin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F3F6F3;
  --paper: #FFFFFF;
  --ink: #16231D;
  --ink-soft: #4B5A52;
  --line: #DEE6DF;
  --emerald: #1F7A5C;
  --emerald-deep: #145940;
  --gold: #E8A33D;
  --gold-deep: #B87D1F;
  --brick: #B0473A;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(22,35,29,0.06), 0 1px 1px rgba(22,35,29,0.04);
  --shadow-md: 0 8px 24px rgba(22,35,29,0.10), 0 2px 6px rgba(22,35,29,0.06);
  --shadow-lg: 0 20px 50px rgba(22,35,29,0.16), 0 6px 16px rgba(22,35,29,0.08);
  --font-display: 'Heebo', 'Cairo', sans-serif;
  --font-body: 'Rubik', 'Cairo', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
[dir="rtl"]{ --font-display: 'Heebo', sans-serif; --font-body: 'Rubik', sans-serif; }
html[lang="ar"]{ --font-display: 'Cairo', sans-serif; --font-body: 'Cairo', sans-serif; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
#app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ===== Topbar ===== */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  background: rgba(243,246,243,0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-0.02em;}
.brand-coin{
  width:30px; height:30px; border-radius:50%;
  background: linear-gradient(155deg, var(--gold) 0%, var(--gold-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:#fff; font-weight:800; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.18), 0 2px 4px rgba(184,125,31,0.4);
}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--ink); transition: transform .15s ease, box-shadow .15s ease;
}
.icon-btn:hover{ box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.lang-pill{
  display:flex; align-items:center; gap:5px;
  border:1px solid var(--line); background:var(--paper);
  border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600;
}
.lang-menu{
  position:absolute; top:56px; inset-inline-end:18px; z-index:50;
  background:var(--paper); border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  border:1px solid var(--line); overflow:hidden; min-width:160px;
  display:none;
}
.lang-menu.open{display:block;}
.lang-opt{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; font-size:14px; font-weight:500; border-bottom:1px solid var(--line);
}
.lang-opt:last-child{border-bottom:none;}
.lang-opt:hover{background:var(--bg);}
.lang-opt.active{color:var(--emerald-deep); font-weight:700;}

/* ===== Goal Picker ===== */
.goals-header{ text-align:center; padding:60px 24px 24px; }
.goals-title{ font-size:22px; font-weight:800; color:var(--ink); margin-bottom:6px; }
.goals-sub{ font-size:14px; color:var(--muted); }
.goals-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px 40px; }
.goal-congrats{ margin:0 20px 20px; padding:16px 18px; border-radius:var(--radius-lg); background: linear-gradient(135deg, #ECFDF5, #F0FDF4); border:1.5px solid #86EFAC; text-align:center; }
.goal-congrats-emoji{ font-size:30px; margin-bottom:6px; }
.goal-congrats-text{ font-weight:700; font-size:14px; color:#166534; }
.goal-card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:24px 12px; border-radius:var(--radius-lg); border:1.5px solid var(--line);
  background:var(--paper); transition: box-shadow .2s ease, transform .15s ease;
}
.goal-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
.goal-emoji{ font-size:32px; }
.goal-label{ font-size:14px; font-weight:700; color:var(--ink); text-align:center; }

/* ===== Glow effect ===== */
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 8px 2px rgba(31,122,92,0.35); }
  50% { box-shadow: 0 0 16px 5px rgba(31,122,92,0.55); }
}
.cat-card.glow, .reallife-toggle.glow {
  animation: glowPulse 2s ease-in-out infinite;
  border-color: var(--accent-deep, var(--emerald-deep));
}

/* ===== Confirm Modal ===== */
.modal-overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(22,35,29,0.45);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.modal-card{
  background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:24px 22px; max-width:360px; width:100%; text-align:start;
}
.modal-message{ font-size:15px; line-height:1.5; color:var(--ink); margin-bottom:20px; }
.modal-actions{ display:flex; gap:10px; }
.modal-actions .btn-ghost, .modal-actions .btn-primary{ flex:1; }

/* ===== Screens ===== */
.screen{ display:none; animation: fadeUp .35s ease; }
.screen.active{display:block;}
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

/* ===== Login ===== */
.login-wrap{ padding:26px 22px 10px; text-align:center; }
.login-hero{ display:flex; justify-content:center; margin: 8px 0 6px; }
.login-title{ font-family:var(--font-display); font-weight:800; font-size:30px; letter-spacing:-0.02em; margin:6px 0 4px; }
.login-tag{ color:var(--ink-soft); font-size:15px; line-height:1.5; max-width:340px; margin:0 auto 26px; }
.login-card{
  background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  padding:24px 22px 22px; text-align:start; border:1px solid var(--line);
}
.field-label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; display:block; text-transform:uppercase; letter-spacing:.04em; }
.field-input{
  width:100%; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
  font-size:16px; font-family:inherit; background:var(--bg); color:var(--ink); margin-bottom:16px;
  transition: border-color .15s ease;
}
.field-input:focus{ outline:none; border-color:var(--emerald); background:var(--paper); }
.avatar-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.avatar-opt{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:20px; border:2px solid transparent; background:var(--bg);
}
.avatar-opt.selected{ border-color: var(--emerald); background:#E4F1EB; }
.btn-primary{
  width:100%; padding:15px; border-radius:999px; border:none;
  background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-deep) 100%);
  color:#fff; font-weight:700; font-size:16px; box-shadow: 0 6px 18px rgba(31,122,92,0.32);
  transition: transform .12s ease;
}
.btn-primary:hover{ transform: translateY(-1px); }
.btn-primary:active{ transform: translateY(0); }
.btn-primary:disabled{ opacity:.5; box-shadow:none; }
.login-note{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }
.login-langs{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
.mini-lang{
  padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
  font-size:13px; font-weight:600; color:var(--ink-soft);
}
.mini-lang.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* growth sprite */
.sprite{ width:120px; height:100px; }
.coin{ transform-origin:center; }
.sprite .c1{ animation: rise .9s ease .1s both; }
.sprite .c2{ animation: rise .9s ease .28s both; }
.sprite .c3{ animation: rise .9s ease .46s both; }
.sprite .c4{ animation: rise .9s ease .64s both; }
.sprite .leaf{ animation: pop .5s ease .95s both; transform-origin: 60px 30px; }
@keyframes rise{ from{ transform: translateY(14px) scale(.7); opacity:0;} to{ transform:translateY(0) scale(1); opacity:1;} }
@keyframes pop{ from{ transform: scale(0) rotate(-20deg); opacity:0;} to{ transform: scale(1) rotate(0deg); opacity:1;} }
@media (prefers-reduced-motion: reduce){ .sprite *{animation:none !important;} }

/* ===== Home ===== */
.home-header{ padding:20px 20px 4px; }
.greeting{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-0.02em; }
.greeting-sub{ color:var(--ink-soft); font-size:14.5px; margin-top:4px; }
.progress-band{
  margin:16px 20px 6px; padding:16px 18px; border-radius:var(--radius-md);
  background: linear-gradient(120deg, var(--emerald-deep), var(--emerald));
  color:#fff; display:flex; align-items:center; justify-content:space-between; box-shadow: var(--shadow-md);
}
.progress-band .num{ font-family:var(--font-mono); font-size:26px; font-weight:700; }
.progress-band .lbl{ font-size:12.5px; opacity:.85; margin-top:2px; }
.progress-ring-wrap{ width:52px; height:52px; }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 20px 10px; }
@media (max-width:380px){ .grid{grid-template-columns:1fr;} }
.cat-card{
  background:var(--paper); border-radius:var(--radius-md); padding:16px 15px;
  box-shadow:var(--shadow-sm); border:1px solid var(--line); text-align:start;
  display:flex; flex-direction:column; gap:10px; min-height:132px; position:relative; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.cat-card::before{
  content:''; position:absolute; inset-inline-end:-18px; top:-18px; width:70px; height:70px; border-radius:50%;
  background: var(--accent); opacity:.12;
}
.cat-icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; background: var(--accent); box-shadow: var(--shadow-sm); }
.cat-name{ font-family:var(--font-display); font-weight:700; font-size:14.5px; line-height:1.28; }
.cat-meta{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
.cat-bar{ height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:2px;}
.cat-bar-fill{ height:100%; background:var(--accent); border-radius:4px; transition: width .4s ease; }

.footnote{ padding:22px 26px 10px; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.6; }

/* ===== Category screen ===== */
.subhead{ display:flex; align-items:center; gap:12px; padding:16px 18px 6px; }
.back-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.cat-title-row{ display:flex; align-items:center; gap:10px; }
.cat-title-icon{ width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--accent); }
.cat-title{ font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-0.01em; }
.cat-sub-count{ font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono); }

.subsection{ margin: 18px 18px 0; }
.subsection-name{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-deep);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.subsection-name::after{ content:''; flex:1; height:1px; background:var(--line); }
.topic-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.topic-row{
  display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:13px 14px; text-align:start; box-shadow: var(--shadow-sm);
  transition: transform .12s ease, border-color .12s ease;
}
.topic-row:hover{ transform: translateX(2px); border-color: var(--accent); }
[dir="rtl"] .topic-row:hover{ transform: translateX(-2px); }
.topic-check{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
}
.topic-check.done{ background: var(--emerald); border-color:var(--emerald); }
.topic-title{ font-size:14.5px; font-weight:500; line-height:1.35; flex:1; }
.topic-arrow{ color:var(--ink-soft); font-size:13px; opacity:.6; flex-shrink:0; }

/* ===== Lesson screen ===== */
.lesson-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 0; }
.lesson-crumb{ font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); padding:0 22px; margin-top:14px; }
.lesson-card{
  margin:14px 18px 0; background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  border:1px solid var(--line); padding:26px 24px 24px; position:relative; overflow:hidden;
}
.lesson-card::before{
  content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--accent);
}
.lesson-title{ font-family:var(--font-display); font-weight:800; font-size:22px; line-height:1.28; letter-spacing:-0.01em; margin-bottom:14px; }
.lesson-body{ font-size:16px; line-height:1.75; color:#26332C; }
.lesson-mark{
  margin-top:22px; display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--bg); font-weight:600; font-size:14px; width:100%; justify-content:center;
}
.lesson-mark.done{ background: #E4F1EB; border-color: var(--emerald); color:var(--emerald-deep); }
.lesson-nav{ display:flex; gap:10px; padding:16px 18px 4px; }
.nav-btn{
  flex:1; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--paper);
  font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow: var(--shadow-sm);
}
.nav-btn:disabled{ opacity:.35; }
.nav-btn.primary{ background: var(--ink); color:#fff; border-color:var(--ink); }

/* language wrapper direction utility */
[dir="rtl"] .icon-flip{ transform: scaleX(-1); }

/* ===== Quiz ===== */
.quiz-progress-row{ display:flex; gap:6px; padding:16px 18px 0; }
.quiz-dot{ flex:1; height:5px; border-radius:4px; background:var(--line); }
.quiz-dot.filled{ background: var(--accent-deep); }
.quiz-card{
  margin:16px 18px 0; background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  border:1px solid var(--line); padding:24px 22px; position:relative; overflow:hidden;
}
.quiz-card::before{ content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--accent-deep); }
.quiz-qnum{ font-size:12px; font-weight:700; color:var(--accent-deep); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.quiz-question{ font-family:var(--font-display); font-weight:800; font-size:19px; line-height:1.35; margin-bottom:18px; }
.quiz-options{ display:flex; flex-direction:column; gap:10px; }
.quiz-opt{
  text-align:start; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
  background:var(--bg); font-size:14.5px; font-weight:500; line-height:1.4; display:flex; align-items:center; gap:12px;
  transition: border-color .12s ease, background .12s ease;
}
.quiz-opt-letter{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:var(--font-mono); background:var(--paper);
}
.quiz-opt.selected{ border-color: var(--accent-deep); background: color-mix(in srgb, var(--accent-deep) 10%, var(--paper)); }
.quiz-opt.selected .quiz-opt-letter{ background: var(--accent-deep); color:#fff; border-color:var(--accent-deep); }
.quiz-nav-row{ display:flex; gap:10px; padding:18px 18px 4px; }
.quiz-results{ text-align:center; padding:8px 6px; }
.quiz-score-ring{ margin:6px auto 14px; }
.quiz-score-num{ font-family:var(--font-display); font-weight:800; font-size:32px; }
.quiz-score-lbl{ font-size:14px; color:var(--ink-soft); margin-bottom:20px; }
.quiz-answer-review{ text-align:start; display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.quiz-review-item{ padding:12px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--bg); }
.quiz-review-item.correct{ border-color:var(--emerald); background:#E4F1EB; }
.quiz-review-item.wrong{ border-color:var(--brick); background:#FBEAE7; }
.quiz-review-q{ font-size:13px; font-weight:600; margin-bottom:4px; }
.quiz-review-a{ font-size:12.5px; color:var(--ink-soft); }
.quiz-cta-row{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-ghost{
  width:100%; padding:13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
  font-weight:600; font-size:14px; color:var(--ink);
}
.switch-user-btn{
  padding:9px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
  font-weight:600; font-size:13px; color:var(--ink); white-space:nowrap;
  transition: box-shadow .15s ease, transform .15s ease;
}
.switch-user-btn:hover{ box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.subsection-quiz-btn{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--accent-deep);
  background: color-mix(in srgb, var(--accent-deep) 12%, var(--paper)); border:none; border-radius:999px; padding:6px 12px;
  margin-inline-start:8px; flex-shrink:0;
}
.subsection-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.subsection-name-row .subsection-name{ margin-bottom:0; flex:1; }
.quiz-gate-note{ font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.5; }

/* ===== XP / Levels / Badges ===== */
.xp-toast{
  position:fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px; font-weight:700;
  display:flex; align-items:center; gap:8px; box-shadow: var(--shadow-lg); opacity:0; transition: opacity .3s ease, transform .3s ease;
  z-index:100; max-width:88%;
}
.xp-toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

.level-chip-row{ display:flex; align-items:center; gap:10px; margin:14px 20px 0; }
.level-chip{
  display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px 6px 6px; box-shadow: var(--shadow-sm); flex-shrink:0;
}
[dir="rtl"] .level-chip{ padding:6px 6px 6px 12px; }
.level-chip-emoji{ width:28px; height:28px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:15px; }
.level-chip-name{ font-size:12.5px; font-weight:700; }
.xp-bar-track{ flex:1; height:8px; border-radius:8px; background:var(--line); overflow:hidden; }
.xp-bar-fill{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); border-radius:8px; transition: width .4s ease; }
.xp-text{ font-size:11px; font-family:var(--font-mono); color:var(--ink-soft); flex-shrink:0; }

.profile-header{ text-align:center; padding:22px 20px 6px; }
.profile-level-badge{ width:84px; height:84px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:40px; background: linear-gradient(155deg, var(--gold), var(--gold-deep)); box-shadow: var(--shadow-md); }
.profile-level-name{ font-family:var(--font-display); font-weight:800; font-size:20px; }
.profile-xp-row{ display:flex; align-items:center; gap:10px; max-width:280px; margin:10px auto 0; }
.stat-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:18px 20px 6px; }
.stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 10px; text-align:center; box-shadow: var(--shadow-sm); }
.stat-num{ font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--emerald-deep); }
.stat-lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; line-height:1.3; }
.badge-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:14px 20px 24px; }
.badge-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 12px; text-align:center; box-shadow: var(--shadow-sm); opacity:0.45; }
.badge-card.earned{ opacity:1; border-color: var(--gold); background: linear-gradient(160deg, #FFF9EE, var(--paper)); }
.badge-emoji{ font-size:28px; margin-bottom:6px; }
.badge-name{ font-size:12px; font-weight:700; line-height:1.3; }
.badge-desc{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; line-height:1.3; }

/* ===== Tools grid ===== */
.tools-section-hdr{ padding:20px 20px 4px; }
.tools-section-title{ font-family:var(--font-display); font-weight:800; font-size:17px; }
.tool-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px;
  display:flex; align-items:center; gap:14px; box-shadow: var(--shadow-sm); margin:10px 20px 0; text-align:start;
  transition: transform .15s ease, box-shadow .15s ease;
}
.tool-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tool-icon{ width:46px; height:46px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
.tool-name{ font-family:var(--font-display); font-weight:700; font-size:14.5px; }
.tool-desc{ font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }

/* ===== Calculators ===== */
.calc-card{ margin:16px 18px 0; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; box-shadow: var(--shadow-md); }
.calc-field{ margin-bottom:18px; }
.calc-field-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.calc-field-label{ font-size:13px; font-weight:700; color:var(--ink-soft); }
.calc-field-value{ font-size:14px; font-weight:800; font-family:var(--font-mono); color:var(--emerald-deep); }
.calc-slider{ width:100%; accent-color: var(--emerald); height:6px; }
.calc-results{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.calc-result-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:var(--radius-sm); background:var(--bg); }
.calc-result-row.highlight{ background:#E4F1EB; border:1.5px solid var(--emerald); }
.calc-result-lbl{ font-size:13px; font-weight:600; }
.calc-result-val{ font-size:15px; font-weight:800; font-family:var(--font-mono); }
.calc-note{ font-size:11.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5; text-align:center; }
.calc-chart-wrap{ margin-top:16px; }
.paycheck-bar{ display:flex; height:36px; border-radius:10px; overflow:hidden; margin:14px 0; box-shadow: var(--shadow-sm); }
.paycheck-legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:4px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
.legend-dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* ===== Simulator ===== */
.sim-hero{ text-align:center; padding:26px 22px 10px; }
.sim-stats-row{ display:flex; gap:10px; padding:14px 18px 0; }
.sim-stat{ flex:1; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; text-align:center; box-shadow: var(--shadow-sm); }
.sim-stat-num{ font-family:var(--font-mono); font-weight:800; font-size:15px; }
.sim-stat-lbl{ font-size:10px; color:var(--ink-soft); margin-top:2px; }
.sim-round-card{ margin:16px 18px 0; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow: var(--shadow-md); text-align:center; }
.sim-round-lbl{ font-size:12px; font-weight:700; color:var(--emerald-deep); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em; }
.sim-pay-amt{ font-family:var(--font-display); font-weight:800; font-size:30px; margin:8px 0 4px; }
.sim-prompt{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }
.sim-action-row{ display:flex; flex-direction:column; gap:10px; }
.sim-action-btn{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--bg); text-align:start; }
.sim-action-emoji{ font-size:22px; flex-shrink:0; }
.sim-action-name{ font-size:14px; font-weight:700; }
.sim-action-sub{ font-size:11.5px; color:var(--ink-soft); }
.sim-outcome-card{ margin:16px 18px 0; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; box-shadow: var(--shadow-md); }
.sim-outcome-line{ font-size:14.5px; line-height:1.6; margin-bottom:10px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--bg); }
.sim-summary-num{ font-family:var(--font-display); font-weight:800; font-size:26px; }

/* ===== Real Life toggle ===== */
.reallife-toggle-row{ padding:14px 20px 0; }
.reallife-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:10px 14px; box-shadow:var(--shadow-sm); }
.reallife-toggle.active{ border-color:#0038B8; background: linear-gradient(90deg, #EAF0FF, var(--paper)); box-shadow: 0 0 0 3px rgba(0,56,184,0.15), var(--shadow-sm); }
.reallife-toggle-label{ font-weight:800; font-size:13px; letter-spacing:.03em; display:flex; align-items:center; gap:6px; }
.reallife-switch{ width:46px; height:26px; border-radius:999px; background:var(--line); position:relative; transition: background .2s ease; flex-shrink:0; }
.reallife-toggle.active .reallife-switch{ background:#0038B8; }
.reallife-switch-thumb{ position:absolute; top:3px; inset-inline-start:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition: inset-inline-start .2s ease; }
.reallife-toggle.active .reallife-switch-thumb{ inset-inline-start:23px; }
@keyframes pulseGlow{ 0%,100%{box-shadow:0 0 0 0 rgba(0,56,184,0.22);} 50%{box-shadow:0 0 0 7px rgba(0,56,184,0);} }
.reallife-toggle:not(.active){ animation: pulseGlow 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .reallife-toggle:not(.active){ animation:none; } }

.reallife-featured-card{ margin:16px 20px 0; background: linear-gradient(135deg, #0038B8, #1D4ED8); border-radius:var(--radius-lg); padding:22px; color:#fff; box-shadow: var(--shadow-lg); text-align:start; position:relative; overflow:hidden; }
.reallife-featured-card::before{ content:''; position:absolute; inset-inline-end:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.12); }
.reallife-featured-icon{ font-size:34px; margin-bottom:8px; }
.reallife-featured-name{ font-family:var(--font-display); font-weight:800; font-size:19px; position:relative; }
.reallife-featured-meta{ font-size:12.5px; opacity:.85; margin-top:4px; font-family:var(--font-mono); position:relative; }
.reallife-featured-bar{ height:6px; border-radius:6px; background:rgba(255,255,255,0.25); overflow:hidden; margin-top:14px; position:relative; }
.reallife-featured-bar-fill{ height:100%; background:#fff; border-radius:6px; }
</style>

<body>
<div id="app"></div>
<script>
const DATA = [
{id:'basics', icon:'🧠', color:'#3A5A78', name:{en:'Financial Basics', he:'יסודות פיננסיים', ar:'الأساسيات المالية'},
 subs:[
  {name:{en:'The Building Blocks', he:'אבני היסוד', ar:'اللبنات الأساسية'}, topics:[
   {id:'income', en:{t:`What Is Income?`,b:`Income is money you receive — from a job, an allowance, a gift, or a business. Knowing your income is the first step to managing money well, because you can only budget what you actually have.`}, he:{t:`מהי הכנסה?`,b:`הכנסה היא כסף שאתם מקבלים — ממשכורת, דמי כיס, מתנה או עסק. הכרת ההכנסה שלכם היא הצעד הראשון לניהול כסף נכון, כי אפשר לתקצב רק את מה שבאמת יש לכם.`}, ar:{t:`ما هو الدخل؟`,b:`الدخل هو المال الذي تحصل عليه — من عمل، أو مصروف جيب، أو هدية، أو مشروع. معرفة دخلك هي الخطوة الأولى لإدارة المال بشكل جيد، لأنك تستطيع فقط وضع ميزانية لما تملكه فعلاً.`}},
   {id:'expenses', en:{t:`What Are Expenses?`,b:`Expenses are everything you spend money on — bus fare, snacks, games, clothes. Tracking your expenses shows you exactly where your money goes, which is the only way to spend on purpose instead of by accident.`}, he:{t:`מהן הוצאות?`,b:`הוצאות הן כל דבר שאתם מוציאים עליו כסף — נסיעות באוטובוס, חטיפים, משחקים, בגדים. מעקב אחר ההוצאות מראה לכם בדיוק לאן הכסף שלכם הולך, וזו הדרך היחידה להוציא כסף במודע ולא בטעות.`}, ar:{t:`ما هي المصروفات؟`,b:`المصروفات هي كل ما تنفق عليه المال — أجرة الحافلة، الوجبات الخفيفة، الألعاب، الملابس. تتبّع مصروفاتك يُظهر لك بالضبط إلى أين يذهب مالك، وهذه هي الطريقة الوحيدة للإنفاق بوعي بدلاً من الصدفة.`}},
   {id:'budgeting', en:{t:`What Is Budgeting?`,b:`A budget is a simple plan for your money — how much comes in, and how much goes out to spending, saving, and giving. Even a basic budget helps you avoid running out of money before your next income arrives.`}, he:{t:`מהו תקציב?`,b:`תקציב הוא תוכנית פשוטה לכסף שלכם — כמה נכנס וכמה יוצא להוצאות, לחיסכון ולתרומה. גם תקציב בסיסי עוזר להימנע מלהיגמר לכם הכסף לפני שההכנסה הבאה מגיעה.`}, ar:{t:`ما هي الميزانية؟`,b:`الميزانية هي خطة بسيطة لمالك — كم يدخل وكم يخرج للإنفاق والادخار والعطاء. حتى الميزانية البسيطة تساعدك على تجنّب نفاد المال قبل وصول دخلك التالي.`}}
  ]},
  {name:{en:'Core Ideas', he:'רעיונות מרכזיים', ar:'الأفكار الأساسية'}, topics:[
   {id:'saving-overview', en:{t:`What Is Saving?`,b:`Saving means setting money aside now so you can use it later instead of spending it today. It's how you build toward goals — big or small — without relying on debt.`}, he:{t:`מהו חיסכון?`,b:`חיסכון הוא הפרשת כסף בצד עכשיו כדי להשתמש בו מאוחר יותר במקום להוציא אותו היום. כך בונים לקראת מטרות — גדולות או קטנות — בלי להסתמך על חוב.`}, ar:{t:`ما هو الادخار؟`,b:`الادخار يعني تخصيص المال جانباً الآن لاستخدامه لاحقاً بدلاً من إنفاقه اليوم. بهذه الطريقة تبني نحو أهدافك — كبيرة كانت أو صغيرة — دون الاعتماد على الديون.`}},
   {id:'investing-overview', en:{t:`What Is Investing?`,b:`Investing means putting your money into something — like stocks or a fund — with the goal of growing it over time. Unlike saving, investing carries risk, but it also gives your money the chance to grow faster than inflation.`}, he:{t:`מהי השקעה?`,b:`השקעה היא הכנסת כסף למשהו — כמו מניות או קרן — במטרה להגדיל אותו לאורך זמן. בניגוד לחיסכון, בהשקעה יש סיכון, אבל היא גם נותנת לכסף שלכם סיכוי לגדול מהר יותר מהאינפלציה.`}, ar:{t:`ما هو الاستثمار؟`,b:`الاستثمار يعني وضع مالك في شيء ما — مثل الأسهم أو صندوق استثماري — بهدف تنميته مع مرور الوقت. على عكس الادخار، الاستثمار ينطوي على مخاطرة، لكنه أيضاً يمنح مالك فرصة النمو أسرع من التضخم.`}},
   {id:'interest-overview', en:{t:`What Is Interest?`,b:`Interest is the price of money — it's what a bank pays you for keeping your savings with them, or what you pay when you borrow money. Understanding interest helps you see why saving early, and borrowing carefully, both matter.`}, he:{t:`מהי ריבית?`,b:`ריבית היא "מחיר" הכסף — זה מה שהבנק משלם לכם על שמירת החיסכון אצלו, או מה שאתם משלמים כשאתם לווים כסף. הבנת הריבית עוזרת לראות למה חשוב לחסוך מוקדם וללוות בזהירות.`}, ar:{t:`ما هي الفائدة؟`,b:`الفائدة هي "ثمن" المال — وهي ما يدفعه لك البنك مقابل الاحتفاظ بمدخراتك لديه، أو ما تدفعه عندما تقترض مالاً. فهم الفائدة يساعدك على إدراك أهمية الادخار مبكراً والاقتراض بحذر.`}},
   {id:'inflation-overview', en:{t:`What Is Inflation?`,b:`Inflation is when prices rise over time, so the same amount of money buys less than it used to. That's why ₪100 today won't buy as much in ten years — and why keeping money productive matters.`}, he:{t:`מהי אינפלציה?`,b:`אינפלציה היא עלייה במחירים לאורך זמן, כך שאותו סכום כסף קונה פחות ממה שקנה בעבר. זו הסיבה ש-100 ₪ היום לא יקנו את אותו הדבר בעוד עשר שנים — ולמה חשוב לגרום לכסף לעבוד.`}, ar:{t:`ما هو التضخم؟`,b:`التضخم هو ارتفاع الأسعار مع مرور الوقت، بحيث يشتري نفس المبلغ من المال أقل مما كان يشتريه سابقاً. لهذا السبب لن يشتري 100 شيكل اليوم نفس الأشياء بعد عشر سنوات — ولهذا يهم أن يبقى المال يعمل.`}}
  ]},
  {name:{en:'Risk & Debt', he:'סיכון וחוב', ar:'المخاطر والديون'}, topics:[
   {id:'risk', en:{t:`What Is Risk?`,b:`Risk is the chance that something won't go as planned — like an investment losing value. Every financial choice involves some risk, so learning to recognize and manage it is more useful than trying to avoid it completely.`}, he:{t:`מהו סיכון?`,b:`סיכון הוא הסיכוי שמשהו לא יתנהל כמתוכנן — כמו השקעה שמאבדת מערכה. בכל החלטה פיננסית יש סיכון מסוים, ולכן ללמוד לזהות ולנהל אותו שימושי יותר מלנסות להימנע ממנו לגמרי.`}, ar:{t:`ما هي المخاطرة؟`,b:`المخاطرة هي احتمال ألا يسير شيء كما هو مخطط له — مثل استثمار يفقد قيمته. كل قرار مالي ينطوي على قدر من المخاطرة، لذا فإن تعلّم التعرف عليها وإدارتها أفيد من محاولة تجنبها تماماً.`}},
   {id:'debt', en:{t:`What Is Debt?`,b:`Debt is money you owe to someone else — a bank, a store, or a person — usually with interest added on top. Some debt (like a mortgage) can be reasonable; other debt (like high-interest credit) can trap you if you're not careful.`}, he:{t:`מהו חוב?`,b:`חוב הוא כסף שאתם חייבים למישהו אחר — בנק, חנות או אדם — בדרך כלל עם ריבית שמתווספת עליו. חוב מסוים (כמו משכנתא) יכול להיות סביר; חוב אחר (כמו אשראי בריבית גבוהה) עלול ללכוד אתכם אם לא נזהרים.`}, ar:{t:`ما هو الدين؟`,b:`الدين هو مال تدين به لجهة أخرى — بنك أو متجر أو شخص — عادةً مع فائدة تُضاف عليه. بعض الديون (مثل قرض الرهن العقاري) يمكن أن تكون معقولة؛ ديون أخرى (مثل الائتمان مرتفع الفائدة) قد تُوقعك في فخ إذا لم تكن حذراً.`}},
   {id:'assets-liabilities', en:{t:`Assets vs. Liabilities`,b:`An asset is something that puts money in your pocket or grows in value, like savings or stocks. A liability is something that costs you money, like a loan. Building wealth means growing your assets faster than your liabilities.`}, he:{t:`נכסים מול התחייבויות`,b:`נכס הוא משהו שמכניס לכם כסף לכיס או עולה בערכו, כמו חיסכון או מניות. התחייבות היא משהו שעולה לכם כסף, כמו הלוואה. בניית עושר משמעה לגדל את הנכסים מהר יותר מההתחייבויות.`}, ar:{t:`الأصول مقابل الالتزامات`,b:`الأصل هو شيء يضع مالاً في جيبك أو يزداد قيمة، مثل المدخرات أو الأسهم. الالتزام هو شيء يكلفك مالاً، مثل القرض. بناء الثروة يعني تنمية أصولك أسرع من التزاماتك.`}}
  ]},
  {name:{en:'Growing & Talking Money', he:'לגדל כסף ולדבר את השפה', ar:'تنمية المال ولغته'}, topics:[
   {id:'compound-interest', en:{t:`Compound Interest`,b:`Compound interest means you earn interest not just on your original money, but also on the interest it already earned. Over many years, this "snowball effect" is one of the most powerful forces in building wealth — the earlier you start, the bigger it grows.`}, he:{t:`ריבית דריבית`,b:`ריבית דריבית משמעה שאתם מרוויחים ריבית לא רק על הכסף המקורי, אלא גם על הריבית שכבר הרווחתם. לאורך שנים רבות, "אפקט כדור השלג" הזה הוא אחד הכוחות החזקים ביותר בבניית עושר — ככל שמתחילים מוקדם יותר, כך הוא גדל יותר.`}, ar:{t:`الفائدة المركبة`,b:`الفائدة المركبة تعني أنك تكسب فائدة ليس فقط على مالك الأصلي، بل أيضاً على الفائدة التي كسبتها سابقاً. على مدى سنوات طويلة، يُعد هذا "تأثير كرة الثلج" من أقوى القوى في بناء الثروة — كلما بدأت أبكر، كلما نما أكثر.`}},
   {id:'terminology', en:{t:`Speaking the Language of Money`,b:`Finance has its own vocabulary — words like "asset," "yield," or "portfolio." Learning these terms isn't about sounding smart; it's about being able to read a bank statement, a payslip, or an investment app without feeling lost.`}, he:{t:`לדבר את שפת הכסף`,b:`לפיננסים יש אוצר מילים משלהם — מונחים כמו "נכס", "תשואה" או "תיק השקעות". ללמוד את המונחים האלה זה לא כדי להישמע חכמים, אלא כדי להיות מסוגלים לקרוא דף חשבון בנק, תלוש שכר או אפליקציית השקעות בלי להרגיש אבודים.`}, ar:{t:`التحدث بلغة المال`,b:`للمال مفرداته الخاصة — كلمات مثل "الأصل" و"العائد" و"المحفظة الاستثمارية". تعلّم هذه المصطلحات ليس ليبدو كلامك ذكياً، بل لتتمكن من قراءة كشف حساب بنكي أو قسيمة راتب أو تطبيق استثمار دون أن تشعر بالضياع.`}}
  ]}
 ]}
,
{id:'saving', icon:'💰', color:'#1F7A5C', name:{en:'Saving Money', he:'חיסכון', ar:'الادخار'},
 subs:[
  {name:{en:'Getting Started', he:'איך מתחילים', ar:'البداية'}, topics:[
   {id:'saving-what-is', en:{t:`What Is Saving?`,b:`Saving is choosing not to spend some of your money now, so it's there when you need or want it later — a phone, a trip, or just peace of mind. It's the foundation every other financial skill builds on.`}, he:{t:`מהו חיסכון?`,b:`חיסכון הוא הבחירה לא להוציא חלק מהכסף עכשיו, כדי שהוא יהיה זמין כשתצטרכו או תרצו אותו מאוחר יותר — טלפון, טיול, או פשוט שקט נפשי. זהו הבסיס שעליו נבנות כל שאר המיומנויות הפיננסיות.`}, ar:{t:`ما هو الادخار؟`,b:`الادخار هو اختيار عدم إنفاق جزء من مالك الآن، حتى يكون متاحاً عندما تحتاجه أو تريده لاحقاً — هاتف، رحلة، أو مجرد راحة بال. إنه الأساس الذي تُبنى عليه كل مهارة مالية أخرى.`}},
   {id:'saving-goal', en:{t:`How to Set a Savings Goal`,b:`A good savings goal is specific: name the thing, its cost, and a target date. Then divide the cost by the months you have, and you'll know exactly how much to set aside each month.`}, he:{t:`איך קובעים יעד חיסכון`,b:`יעד חיסכון טוב הוא ספציפי: לתת שם לדבר, למחיר שלו ולתאריך יעד. אחר כך מחלקים את המחיר במספר החודשים שיש, וכך יודעים בדיוק כמה להפריש כל חודש.`}, ar:{t:`كيف تحدد هدف ادخار`,b:`هدف الادخار الجيد محدد: سمِّ الشيء وسعره وتاريخاً مستهدفاً. ثم اقسم السعر على عدد الأشهر المتاحة، وستعرف بالضبط كم يجب أن تدخر كل شهر.`}},
   {id:'saving-vs-investing', en:{t:`Saving vs. Investing`,b:`Saving keeps your money safe and easy to access — good for short-term goals and emergencies. Investing takes on more risk for a chance at higher growth — better for long-term goals, years away. Most people need both.`}, he:{t:`חיסכון מול השקעה`,b:`חיסכון שומר על הכסף שלכם בטוח ונגיש בקלות — טוב למטרות קצרות טווח ולמקרי חירום. השקעה כרוכה בסיכון גבוה יותר בתמורה לסיכוי לצמיחה גדולה יותר — מתאימה יותר למטרות ארוכות טווח, שנים קדימה. רוב האנשים צריכים את שניהם.`}, ar:{t:`الادخار مقابل الاستثمار`,b:`الادخار يحافظ على مالك آمناً وسهل الوصول إليه — مناسب للأهداف قصيرة المدى وحالات الطوارئ. الاستثمار ينطوي على مخاطرة أكبر مقابل فرصة نمو أعلى — أفضل للأهداف طويلة المدى، بعد سنوات. معظم الناس يحتاجون كليهما.`}}
  ]},
  {name:{en:'Where to Keep It', he:'איפה שומרים אותו', ar:'أين تحتفظ به'}, topics:[
   {id:'where-keep-savings', en:{t:`Where Can You Keep Your Savings?`,b:`Options range from a simple envelope at home, to a bank savings account, to a fixed-term deposit. Each offers a different mix of safety, access, and growth — the right choice depends on your goal and timeline.`}, he:{t:`איפה אפשר לשמור חיסכון?`,b:`האפשרויות נעות ממעטפה פשוטה בבית, דרך חשבון חיסכון בבנק, ועד פיקדון לתקופה קצובה. לכל אחת יש שילוב שונה של ביטחון, נגישות וצמיחה — הבחירה הנכונה תלויה במטרה ובלוח הזמנים שלכם.`}, ar:{t:`أين يمكنك الاحتفاظ بمدخراتك؟`,b:`تتراوح الخيارات من ظرف بسيط في المنزل، إلى حساب توفير في البنك، إلى وديعة لأجل محدد. كل خيار يوفر مزيجاً مختلفاً من الأمان وسهولة الوصول والنمو — الخيار الصحيح يعتمد على هدفك والوقت المتاح.`}},
   {id:'bank-savings-account', en:{t:`Bank Savings Accounts`,b:`A savings account is a bank account designed for money you're not spending right away. It usually pays a small amount of interest and lets you withdraw when needed, making it a safe first step for young savers in Israel.`}, he:{t:`חשבון חיסכון בבנק`,b:`חשבון חיסכון הוא חשבון בנק שנועד לכסף שלא מתכוונים להוציא מיד. הוא בדרך כלל משלם ריבית קטנה ומאפשר משיכה בעת הצורך, מה שהופך אותו לצעד ראשון בטוח לחוסכים צעירים בישראל.`}, ar:{t:`حسابات التوفير البنكية`,b:`حساب التوفير هو حساب بنكي مخصص للمال الذي لا تنوي إنفاقه فوراً. عادةً ما يدفع فائدة صغيرة ويسمح لك بالسحب عند الحاجة، ما يجعله خطوة أولى آمنة للمدخرين الشباب في إسرائيل.`}},
   {id:'fixed-deposit', en:{t:`Fixed-Term Deposits (Pikadon)`,b:`A pikadon (פיקדון) locks your money in a bank for a set period — say, six months or a year — usually for a higher interest rate than a regular savings account. The trade-off: you generally can't touch the money early without a penalty.`}, he:{t:`פיקדונות בריבית קבועה`,b:`פיקדון "נועל" את הכסף שלכם בבנק לתקופה קבועה — למשל שישה חודשים או שנה — בדרך כלל בריבית גבוהה יותר מחשבון חיסכון רגיל. המחיר: בדרך כלל אי אפשר לגעת בכסף מוקדם בלי לשלם קנס.`}, ar:{t:`الودائع لأجل محدد (بيكادون)`,b:`"البيكادون" يُقفل مالك في البنك لفترة محددة — مثلاً ستة أشهر أو سنة — عادةً مقابل فائدة أعلى من حساب التوفير العادي. المقابل: عادةً لا يمكنك لمس المال مبكراً دون دفع غرامة.`}}
  ]},
  {name:{en:'Making It Work & Staying Safe', he:'לגרום לו לעבוד ולהישאר בטוחים', ar:'جعله يعمل والبقاء آمناً'}, topics:[
   {id:'interest-on-savings', en:{t:`Interest on Savings`,b:`When you keep money in a savings account or deposit, the bank pays you interest — a small percentage added to your balance over time. It's the bank's way of "renting" your money, and it's how savings can slowly grow on their own.`}, he:{t:`ריבית על חיסכון`,b:`כשאתם שומרים כסף בחשבון חיסכון או בפיקדון, הבנק משלם לכם ריבית — אחוז קטן שמתווסף ליתרה שלכם עם הזמן. זו הדרך של הבנק "לשכור" את הכסף שלכם, וכך החיסכון יכול לגדול לאט לבד.`}, ar:{t:`الفائدة على المدخرات`,b:`عندما تحتفظ بالمال في حساب توفير أو وديعة، يدفع لك البنك فائدة — نسبة صغيرة تُضاف إلى رصيدك مع مرور الوقت. هذه طريقة البنك في "استئجار" مالك، وهكذا يمكن للمدخرات أن تنمو ببطء من تلقاء نفسها.`}},
   {id:'inflation-savings', en:{t:`How Inflation Affects Savings`,b:`If prices rise faster than your savings account's interest rate, your money is technically losing buying power even while the balance grows. This is why very long-term savings often need investing, not just a savings account, to keep up.`}, he:{t:`איך אינפלציה משפיעה על חיסכון`,b:`אם המחירים עולים מהר יותר מריבית חשבון החיסכון, הכסף שלכם למעשה מאבד כוח קנייה גם כשהיתרה גדלה. זו הסיבה שחיסכון לטווח ארוך מאוד לרוב זקוק להשקעה, לא רק לחשבון חיסכון, כדי לעמוד בקצב.`}, ar:{t:`كيف يؤثر التضخم على المدخرات`,b:`إذا ارتفعت الأسعار أسرع من فائدة حساب التوفير، فإن مالك يفقد فعلياً قوته الشرائية حتى مع نمو الرصيد. لهذا السبب يحتاج الادخار طويل المدى جداً غالباً إلى الاستثمار، وليس فقط حساب توفير، لمواكبة الأسعار.`}},
   {id:'emergency-fund', en:{t:`Emergency Savings`,b:`An emergency fund is money set aside only for unexpected costs — a lost phone, a medical bill, a sudden need. Financial experts often recommend building this before investing, so a surprise expense never forces you to sell investments at a bad time.`}, he:{t:`חיסכון לשעת חירום`,b:`קרן חירום היא כסף שמופרש רק להוצאות בלתי צפויות — טלפון שאבד, חשבון רפואי, צורך פתאומי. מומחים פיננסיים ממליצים לרוב לבנות אותה לפני שמתחילים להשקיע, כדי שהוצאה מפתיעה לא תאלץ אתכם למכור השקעות ברגע לא נכון.`}, ar:{t:`مدخرات الطوارئ`,b:`صندوق الطوارئ هو مال مخصص فقط للنفقات غير المتوقعة — هاتف مفقود، فاتورة طبية، حاجة مفاجئة. غالباً ما ينصح الخبراء الماليون ببنائه قبل البدء بالاستثمار، حتى لا تضطرك نفقة مفاجئة لبيع استثماراتك في وقت غير مناسب.`}}
  ]}
 ]}
